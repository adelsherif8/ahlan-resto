<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Build Your Sandwich — 3D</title>
<style>
  /* ---------- J Smash theme ----------
     Accent red sampled directly from the J Smash logo (#e81b23). Backgrounds
     shifted from the old forest-green-black to a red-tinted black so the
     radial "studio" gradients still read as ambience, not a color clash.
     Centralized as custom properties so the whole app retints from one place. */
  :root {
    --brand-red: #e81b23;
    --brand-red-rgb: 232, 27, 35;
    --brand-red-dark: #a8121a;
    --bg-mid: #1c0f0f;
    --bg-deep: #0d0808;
    --bg-black: #050303;
    --panel-grad-1: #1a0f0f;
    --panel-grad-2: #0d0808;
    --text-main: #f5ece7;
    --text-on-accent: #fff6f3;
    --text-muted: #b8a29a;
    --text-dim: #6f5f5c;
    --status-ok: #8bc34a;
    --status-error: #f0a35f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--bg-deep);
  }
  #app { position: relative; width: 100%; height: 100%; display: flex; }
  .view-hidden { display: none !important; }

  /* ---------- Brand logo (top-left, all views) ---------- */
  #brand-logo {
    position: fixed; top: 14px; left: 16px; height: 38px; width: auto;
    z-index: 1000; pointer-events: none;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
  }

  /* ---------- Login ---------- */
  #login-screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, var(--bg-mid) 0%, var(--bg-deep) 60%, var(--bg-black) 100%);
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; padding: 20px;
  }
  .login-card {
    width: 100%; max-width: 320px; padding: 28px 24px;
    background: linear-gradient(180deg, var(--panel-grad-1), var(--panel-grad-2));
    border: 1px solid rgba(var(--brand-red-rgb),0.3); border-radius: 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .login-card h2 { margin: 0 0 4px; font-family: Georgia, serif; font-weight: 400; font-size: 20px; color: var(--text-main); text-align: center; }
  .login-demo-creds {
    margin: 4px 0 16px; padding: 10px 12px; border-radius: 8px;
    background: rgba(var(--brand-red-rgb),0.08); border: 1px solid rgba(var(--brand-red-rgb),0.2);
    font-size: 11.5px; color: var(--text-muted); line-height: 1.6;
  }
  .login-demo-creds strong { color: var(--brand-red); }
  #login-form { display: flex; flex-direction: column; gap: 10px; }
  #login-form input {
    padding: 11px 12px; border-radius: 8px; border: 1px solid rgba(var(--brand-red-rgb),0.3);
    background: rgba(255,255,255,0.03); color: var(--text-main); font-size: 14px;
  }
  #login-form input::placeholder { color: var(--text-dim); }
  #login-form button {
    margin-top: 4px; padding: 12px; border: none; border-radius: 10px;
    background: var(--brand-red); color: var(--text-on-accent); font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #login-form button:active { background: var(--brand-red-dark); }
  #login-error { min-height: 14px; font-size: 12px; text-align: center; }

  /* ---------- User bar (logged-in user/admin label + logout) ---------- */
  .user-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .user-bar span { font-size: 12px; color: var(--text-muted); }
  .user-bar button {
    padding: 5px 10px; border-radius: 999px; border: 1px solid rgba(var(--brand-red-rgb),0.5);
    background: transparent; color: var(--text-main); font-size: 11px; cursor: pointer;
  }

  /* ---------- Admin order log ---------- */
  #admin-view {
    width: 100%; height: 100%; overflow-y: auto; box-sizing: border-box; padding: 24px;
    background: radial-gradient(ellipse at center, var(--bg-mid) 0%, var(--bg-deep) 60%, var(--bg-black) 100%);
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; color: var(--text-main);
  }
  .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; padding-left: 46px; }
  .admin-header h1 { margin: 0; font-family: Georgia, serif; font-weight: 400; font-size: 22px; color: var(--text-main); }
  .admin-header .user-bar { margin-bottom: 0; gap: 12px; }
  #admin-order-list table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #admin-order-list th, #admin-order-list td {
    text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(var(--brand-red-rgb),0.15);
  }
  #admin-order-list th {
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brand-red); opacity: 0.9;
  }
  #admin-order-list td { color: var(--text-muted); }
  #admin-empty { color: var(--text-muted); font-size: 13px; padding: 20px 0; }

  /* ---------- My Sandwiches ---------- */
  .save-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .save-row input {
    flex: 1; min-width: 0; padding: 9px 10px; border-radius: 8px; border: 1px solid rgba(var(--brand-red-rgb),0.25);
    background: rgba(255,255,255,0.03); color: var(--text-main); font-size: 12.5px;
  }
  .save-row input::placeholder { color: var(--text-dim); }
  .save-row button {
    padding: 9px 12px; border-radius: 8px; border: 1px solid rgba(var(--brand-red-rgb),0.5);
    background: transparent; color: var(--text-main); font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .saved-chip { margin-bottom: 6px; }

  #scene-container {
    position: relative;
    flex: 1;
    min-width: 0;
    background: radial-gradient(ellipse at center, var(--bg-mid) 0%, var(--bg-deep) 60%, var(--bg-black) 100%);
  }
  canvas#c { position: absolute; inset: 0; display: block; touch-action: none; cursor: grab; }
  canvas#c.dragging { cursor: grabbing; }

  #scene-container header {
    position: absolute; top: 0; left: 0; right: 0; text-align: center;
    padding: 28px 20px 0; pointer-events: none; z-index: 10;
  }
  #scene-container header h1 {
    margin: 0; color: var(--text-main); font-family: Georgia, serif; font-weight: 400;
    font-size: clamp(18px, 3vw, 28px); letter-spacing: 0.03em;
    text-shadow: 0 2px 18px rgba(0,0,0,0.6);
  }
  #scene-container header p {
    margin: 8px 0 0; color: var(--brand-red); font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; opacity: 0.85;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);
  }

  /* ---------- Panel ---------- */
  #panel {
    width: 320px; flex-shrink: 0; display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--panel-grad-1), var(--panel-grad-2));
    border-left: 1px solid rgba(var(--brand-red-rgb),0.3);
    color: var(--text-main); font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  .panel-header { padding: 22px 20px 12px; border-bottom: 1px solid rgba(var(--brand-red-rgb),0.2); }
  .panel-header h2 { margin: 0; font-family: Georgia, serif; font-weight: 400; font-size: 18px; color: var(--text-main); }
  .panel-header span { font-size: 11px; color: var(--text-muted); }

  #panel-scroll { flex: 1; overflow-y: auto; padding: 6px 16px; }
  .cat-group h3 {
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--brand-red); opacity: 0.9; margin: 18px 0 8px;
  }
  .cat-group:first-child h3 { margin-top: 8px; }

  .chip {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; margin-bottom: 6px; border-radius: 10px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(var(--brand-red-rgb),0.15);
  }
  .chip-name { font-size: 13.5px; display: block; }
  .chip-price { font-size: 11px; color: var(--text-muted); display: block; margin-top: 2px; }

  .bread-chip {
    width: 100%; cursor: pointer; text-align: left;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(var(--brand-red-rgb),0.15); color: var(--text-main);
  }
  .bread-chip.active { background: rgba(var(--brand-red-rgb),0.2); border-color: var(--brand-red); }

  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(var(--brand-red-rgb),0.5);
    background: transparent; color: var(--text-main); font-size: 15px; line-height: 1; cursor: pointer;
  }
  .stepper button:disabled { opacity: 0.25; cursor: default; }
  .stepper-qty { width: 16px; text-align: center; font-size: 13px; }

  .panel-summary { padding: 14px 20px 18px; border-top: 1px solid rgba(var(--brand-red-rgb),0.2); }
  .summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: var(--text-muted); }
  #send-order {
    width: 100%; margin-top: 10px; padding: 12px; border: none; border-radius: 10px;
    background: var(--brand-red); color: var(--text-on-accent); font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #send-order:active { transform: scale(0.98); background: var(--brand-red-dark); }
  #order-status { margin-top: 8px; font-size: 12px; text-align: center; min-height: 14px; }
  .status-ok { color: var(--status-ok); }
  .status-error { color: var(--status-error); }
  .status-sending { color: var(--brand-red); }

  @media (max-width: 820px) {
    #app { flex-direction: column; }
    #panel { width: 100%; height: 46vh; border-left: none; border-top: 1px solid rgba(var(--brand-red-rgb),0.3); order: 2; }
    #scene-container { height: 54vh; order: 1; }

    #brand-logo { height: 30px; top: 10px; left: 12px; }
    .admin-header { padding-left: 40px; }
    #scene-container header { padding: max(18px, env(safe-area-inset-top)) 16px 0; }
    .panel-summary { padding-bottom: max(18px, env(safe-area-inset-bottom)); }

    /* Larger touch targets — 26px steppers and tight chip padding are fine with
       a mouse pointer but under Apple/Google's ~40-44px minimum for a fingertip. */
    .chip, .bread-chip { padding: 13px 14px; }
    .stepper button { width: 36px; height: 36px; font-size: 17px; }
    .stepper-qty { width: 20px; font-size: 14px; }
    #send-order { padding: 14px; font-size: 15px; }

    #login-form button, .save-row button { padding: 13px; }
    #admin-view { padding: 16px; }
    #admin-order-list { overflow-x: auto; }
    #admin-order-list table { min-width: 560px; }
  }
</style>
</head>
<body>
<img id="brand-logo" src="jsmash-logo.webp" alt="J Smash" />

<div id="login-screen">
  <div class="login-card">
    <h2>Build Your Sandwich</h2>
    <div class="login-demo-creds">
      <div><strong>Admin</strong> — admin / admin123</div>
      <div><strong>User</strong> — any other username + password (creates it automatically)</div>
    </div>
    <form id="login-form">
      <input id="login-username" type="text" placeholder="Username" autocomplete="username" required />
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Log in</button>
      <div id="login-error" class="status-error"></div>
    </form>
  </div>
</div>

<div id="admin-view" class="view-hidden">
  <header class="admin-header">
    <h1>Order Log</h1>
    <div class="user-bar"><span id="admin-username-label"></span><button id="admin-logout-btn">Logout</button></div>
  </header>
  <div id="admin-order-list"></div>
</div>

<div id="app" class="view-hidden">
  <div id="scene-container">
    <canvas id="c"></canvas>
    <div class="vignette"></div>
    <header>
      <h1>Build Your Sandwich</h1>
      <p>Drag to rotate &middot; Pinch or scroll to zoom</p>
    </header>
  </div>

  <aside id="panel">
    <div class="panel-header">
      <div class="user-bar"><span id="user-username-label"></span><button id="user-logout-btn">Logout</button></div>
      <h2>Customize</h2>
      <span id="total-calories">0 kcal</span>
    </div>
    <div id="panel-scroll"></div>
    <div class="panel-summary">
      <div class="summary-row"><span>Total</span><span id="total-price">EGP 0</span></div>
      <button id="send-order">Send order</button>
      <div id="order-status"></div>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function () {
  // ============================================================
  // CONFIG — edit these before embedding on your site
  // ============================================================
  const CONFIG = {
    // Your n8n Webhook node URL (the "Send order" button POSTs the order here)
    webhookUrl: 'https://your-n8n-instance.example.com/webhook/order',
    currency: 'EGP',
  };
  // Table number comes from the QR code URL, e.g. yoursite.com/order?table=12
  const params = new URLSearchParams(window.location.search);
  const tableId = params.get('table');

  // ============================================================
  // Ingredient catalog — this is your "menu". Add/remove items here.
  //
  // To use a REAL PHOTO instead of the procedural pattern on any ingredient,
  // add a "photo" field, e.g. photo: 'images/turkey.jpg'. Use:
  //   - An image you own or are licensed to use (not something scraped off the web)
  //   - Hosted on your own domain, same-origin as this page (cross-origin images
  //     without CORS headers will silently fail to load as a texture)
  //   - A roughly square, top-down, evenly-lit crop of the ingredient works best
  // If "photo" is missing or fails to load, it automatically falls back to the
  // procedural texture below — so it's safe to add photos gradually.
  // ============================================================
  const CATALOG = [
    { id: 'bread-bun', category: 'bread', name: 'Sesame bun', price: 0, calories: 130,
      color: 0xd9a55c, bottomColor: 0xc98f45, topHeight: 1.19, bottomHeight: 0.47, radius: 1.9, default: true,
      bottomModelUrl: 'Burger1/12_bottombun.glb', topModelUrl: 'Burger1/01_topbun.glb' },

    { id: 'protein-patty', category: 'protein', name: 'Beef patty', price: 35, calories: 250,
      color: 0x6b3a25, height: 0.7, radius: 1.6, edgeNoise: 0.16, topBump: 0.09, roughness: 0.4, metalness: 0.06, seed: 4.4, textureType: 'grilled', modelUrl: 'Burger1/patty.glb' },

    { id: 'cheese-slice', category: 'cheese', name: 'Cheese slice', price: 12, calories: 80,
      color: 0xc13a09, height: 0.35, radius: 1.5, edgeNoise: 0.05, topBump: 0.03, roughness: 0.35, metalness: 0.08, seed: 6.6, textureType: 'cheese', modelUrl: 'Burger1/cheeseslice.glb' },
    { id: 'cheese-melted', category: 'cheese', name: 'Melted cheese', price: 14, calories: 95,
      color: 0xe4680a, height: 0.52, radius: 1.5, edgeNoise: 0.05, topBump: 0.03, roughness: 0.35, metalness: 0.08, seed: 9.1, textureType: 'cheese', modelUrl: 'Burger1/cheesesliceS.glb' },

    { id: 'veg-lettuce', category: 'veggie', name: 'Lettuce', price: 5, calories: 8,
      color: 0x4c8a3a, height: 0.74, radius: 1.7, edgeNoise: 0.22, topBump: 0.18, roughness: 0.7, seed: 5.1, textureType: 'greens', modelUrl: 'Burger1/LETTUCE.glb' },
    { id: 'veg-tomato', category: 'veggie', name: 'Tomato', price: 6, calories: 15,
      color: 0xc1443c, height: 0.53, radius: 1.5, edgeNoise: 0.05, topBump: 0.06, roughness: 0.32, seed: 3.7, textureType: 'tomato', modelUrl: 'Burger1/tomato.glb' },
  ];

  const STACK_ORDER = ['protein', 'cheese', 'veggie']; // bottom to top, between the buns
  const CATEGORY_LABELS = { bread: 'Bread', protein: 'Protein', cheese: 'Cheese', veggie: 'Veggies' };
  const CATEGORY_DISPLAY_ORDER = ['bread', 'cheese', 'protein', 'veggie'];
  const MAX_QTY = 3;

  // ============================================================
  // State
  // ============================================================
  const qty = {};
  CATALOG.forEach(d => { qty[d.id] = 0; });
  qty['bread-bun'] = 1;
  qty['protein-patty'] = 1;
  qty['cheese-slice'] = 1;
  qty['veg-lettuce'] = 1;
  qty['veg-tomato'] = 1;

  // The "original" recipe — snapshotted once, right after the seed above, so
  // it's a stable baseline for both resetting the builder on login and for
  // diffing a sent order for the admin log (see computeOrderLabel below).
  const defaultQty = Object.freeze({ ...qty });

  // ============================================================
  // Accounts / sessions / saved sandwiches / order log
  //
  // PROTOTYPE-ONLY AUTH: plaintext passwords in localStorage, no session
  // expiry, trivially readable/bypassable via devtools. Fine for a local demo
  // with no backend — do not carry this pattern into a real deployment.
  // ============================================================
  const STORAGE_KEYS = {
    accounts: 'sbApp_accounts',        // { [username]: { password, role: 'user'|'admin' } }
    session: 'sbApp_session',          // { username, role } | null
    saved: 'sbApp_savedSandwiches',    // { [username]: { [name]: { qty, savedAt } } }
    orders: 'sbApp_orderLog',          // [{ id, username, label, items, totalPrice, totalCalories, table, timestamp }, ...]
  };

  function loadJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }
  function saveJSON(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  let accounts = loadJSON(STORAGE_KEYS.accounts, null);
  if (!accounts) {
    accounts = { admin: { password: 'admin123', role: 'admin' } };
    saveJSON(STORAGE_KEYS.accounts, accounts);
  }
  let savedSandwiches = loadJSON(STORAGE_KEYS.saved, {});
  let orderLog = loadJSON(STORAGE_KEYS.orders, []);
  let currentUser = null;
  let currentRole = null;

  // ============================================================
  // Three.js setup
  // ============================================================
  const canvas = document.getElementById('c');
  const container = document.getElementById('scene-container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(0, 0.3, 10);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);

  scene.add(new THREE.AmbientLight(0xfff3df, 0.55));
  const key = new THREE.DirectionalLight(0xfff1d8, 1.15); key.position.set(5, 8, 6); scene.add(key);
  const fill = new THREE.DirectionalLight(0x9ecdff, 0.35); fill.position.set(-7, 1, -3); scene.add(fill);
  const rim = new THREE.DirectionalLight(0x8fe3c7, 0.55); rim.position.set(0, -4, -6); scene.add(rim);

  const group = new THREE.Group();
  scene.add(group);

  // Loads a real photo onto a material if one is supplied. Falls back to whatever
  // procedural texture is already on the material if the photo is missing or fails
  // to load (e.g. wrong path, or hosted cross-origin without CORS headers).
  const textureLoader = new THREE.TextureLoader();
  function applyPhotoIfProvided(material, photoUrl, wrapRepeat) {
    if (!photoUrl) return;
    textureLoader.load(
      photoUrl,
      (tex) => {
        if (wrapRepeat) tex.wrapS = THREE.RepeatWrapping;
        material.map = tex;
        material.color.set(0xffffff);
        material.needsUpdate = true;
      },
      undefined,
      () => console.warn('Could not load photo "' + photoUrl + '" — keeping the procedural texture instead.')
    );
  }

  // Loads a real GLB model to replace an ingredient's procedural mesh, if the
  // catalog entry supplies a modelUrl. Bread models must contain meshes named
  // "bottom_bun" and "top_bun" (matching the split the sandwich needs to open
  // around its filling); filling models (protein/cheese/veggie/sauce) are used
  // whole, in place of the procedural blob layer. Falls back to the procedural
  // version if the model is missing the expected meshes or fails to load.
  const gltfLoader = (typeof THREE.GLTFLoader !== 'undefined') ? new THREE.GLTFLoader() : null;
  const modelCache = {};

  // Some found/raw assets ship a placeholder base color that ruins the render:
  // an untextured mesh left at glTF's default white (no baseColorFactor authored),
  // or — worse — a near-black baseColorFactor multiplied against a real texture,
  // which (per the glTF spec, factor and texture multiply) blanks the texture
  // out to solid black. Both are fixed the same way: an untextured placeholder
  // gets tinted with the given fallback color, a textured one just gets its
  // factor reset to white so the texture shows through unmodified.
  function fixPlaceholderColor(material, fallbackColor) {
    const c = material.color;
    const isWhiteDefault = c.r === 1 && c.g === 1 && c.b === 1;
    const isNearBlack = c.r + c.g + c.b < 0.1;
    if (material.map) {
      if (isNearBlack) material.color.set(0xffffff);
    } else if (isWhiteDefault || isNearBlack) {
      material.color.set(fallbackColor);
    }
  }

  // Approximates renderer.outputEncoding = THREE.sRGBEncoding, but scoped to
  // just this one material instead of the whole scene. The renderer's default
  // linear output makes lit pixels look dark on a normal display (monitors
  // expect sRGB-gamma-encoded values); a flat color multiply can't fix that
  // because it boosts shadows and highlights by the same ratio, whereas the
  // real sRGB curve lifts shadows far more than highlights. Baking that curve
  // into the shader via onBeforeCompile reproduces the effect for this
  // material only, without relighting every other ingredient.
  function applySrgbGammaToMaterial(material) {
    material.onBeforeCompile = (shader) => {
      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <dithering_fragment>',
        'gl_FragColor.rgb = pow( gl_FragColor.rgb, vec3( 1.0 / 2.2 ) );\n#include <dithering_fragment>'
      );
    };
    material.needsUpdate = true;
  }

  // Filling models authored for this app follow a "base" (side wall) + "top"
  // (textured cap) convention that already matches our disc-shaped layer, sized
  // and centered to drop straight in. A model that lacks a "base" mesh is
  // treated as a generic/found asset instead: it may be off-center, sized in
  // arbitrary units, or lying flat in the wrong plane, so we recenter it,
  // detect a flat slice lying in XY (thin Z) and rotate it upright to our Y-up
  // convention, then uniformly rescale it to the ingredient's radius.
  // Returns the resulting height (post-rescale) so the caller can correct the
  // catalog's stacking height to match the model's real proportions.
  function normalizeRawFillingModel(root, def) {
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3(); box.getSize(size);
    const center = new THREE.Vector3(); box.getCenter(center);
    root.position.sub(center);

    const wrapper = new THREE.Group();
    wrapper.add(root);

    if (size.z <= size.x && size.z <= size.y) {
      wrapper.rotation.x = -Math.PI / 2;
    }

    wrapper.updateMatrixWorld(true);
    const box2 = new THREE.Box3().setFromObject(wrapper);
    const size2 = new THREE.Vector3(); box2.getSize(size2);
    const horizontalExtent = Math.max(size2.x, size2.z) / 2 || 1;
    const scale = def.radius / horizontalExtent;
    wrapper.scale.setScalar(scale);

    wrapper.traverse((child) => {
      if (!child.isMesh) return;
      child.material.side = THREE.DoubleSide;
      fixPlaceholderColor(child.material, def.color);
    });

    return { object: wrapper, height: size2.y * scale };
  }

  // Same idea as normalizeRawFillingModel, but for a bun half supplied as its
  // own standalone GLB (rather than a bottom_bun/top_bun pair inside one file).
  // Recenters horizontally, sits the flat (cut) face at y=0 — the top face for
  // the bottom half, the bottom face for the top half — then scales the whole
  // piece uniformly so it keeps its natural proportions at the target radius.
  function normalizeRawBunHalf(root, radius, flip, fallbackColor) {
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3(); box.getSize(size);
    const center = new THREE.Vector3(); box.getCenter(center);
    root.position.x -= center.x;
    root.position.z -= center.z;
    root.position.y -= flip ? box.max.y : box.min.y;

    const wrapper = new THREE.Group();
    wrapper.add(root);
    const horizontalExtent = Math.max(size.x, size.z) / 2 || 1;
    const scale = radius / horizontalExtent;
    wrapper.scale.setScalar(scale);

    wrapper.traverse((child) => {
      if (!child.isMesh) return;
      child.material.side = THREE.DoubleSide;
      fixPlaceholderColor(child.material, fallbackColor);
      applySrgbGammaToMaterial(child.material);
    });

    return { object: wrapper, height: size.y * scale };
  }

  function loadModelIfProvided(def) {
    if (modelCache[def.id] || !gltfLoader) return;

    if (def.category === 'bread' && def.bottomModelUrl && def.topModelUrl) {
      modelCache[def.id] = { ready: false };
      let bottomMesh = null, topMesh = null, bottomHeight = null, topHeight = null, pending = 2;
      const finish = () => {
        if (--pending > 0) return;
        if (!bottomMesh || !topMesh) {
          console.warn('Could not load bun models for "' + def.id + '" — keeping the procedural bun instead.');
          return;
        }
        def.bottomHeight = bottomHeight;
        def.topHeight = topHeight;
        modelCache[def.id] = { ready: true, bottomMesh, topMesh };
        refreshIngredientInstances(def);
      };
      gltfLoader.load(def.bottomModelUrl, (gltf) => {
        const fit = normalizeRawBunHalf(gltf.scene, def.radius, true, def.bottomColor || def.color);
        bottomMesh = fit.object; bottomHeight = fit.height; finish();
      }, undefined, () => { console.warn('Could not load "' + def.bottomModelUrl + '"'); finish(); });
      gltfLoader.load(def.topModelUrl, (gltf) => {
        const fit = normalizeRawBunHalf(gltf.scene, def.radius, false, def.color);
        topMesh = fit.object; topHeight = fit.height; finish();
      }, undefined, () => { console.warn('Could not load "' + def.topModelUrl + '"'); finish(); });
      return;
    }

    if (!def.modelUrl) return;
    modelCache[def.id] = { ready: false };
    gltfLoader.load(
      def.modelUrl,
      (gltf) => {
        if (def.category === 'bread') {
          const bottomMesh = gltf.scene.getObjectByName('bottom_bun');
          const topMesh = gltf.scene.getObjectByName('top_bun');
          if (!bottomMesh || !topMesh) {
            console.warn('Model "' + def.modelUrl + '" is missing "bottom_bun"/"top_bun" meshes — keeping the procedural bun instead.');
            return;
          }
          modelCache[def.id] = { ready: true, bottomMesh, topMesh };
        } else {
          const hasBase = !!gltf.scene.getObjectByName('base');
          if (hasBase) {
            modelCache[def.id] = { ready: true, root: gltf.scene };
          } else {
            const fit = normalizeRawFillingModel(gltf.scene, def);
            def.height = fit.height;
            modelCache[def.id] = { ready: true, root: fit.object };
          }
        }
        refreshIngredientInstances(def);
      },
      undefined,
      () => console.warn('Could not load model "' + def.modelUrl + '" — keeping the procedural version instead.')
    );
  }

  // ---------- Geometry helpers ----------
  function noise1(angle, seed) {
    return Math.sin(angle * 5 + seed) * 0.5 + Math.sin(angle * 11 + seed * 2.1) * 0.28 + Math.sin(angle * 3 + seed * 0.6) * 0.22;
  }

  // ---------- Procedural food texture generation ----------
  function shadeColor(hex, factor) {
    const c = new THREE.Color(hex);
    c.multiplyScalar(factor);
    return '#' + c.getHexString();
  }
  function lighten(hex, factor) {
    const c = new THREE.Color(hex);
    c.lerp(new THREE.Color(0xffffff), factor);
    return '#' + c.getHexString();
  }

  // Top-face texture for fillings — drawn as a circle so it maps cleanly onto a cylinder cap
  function makeFoodTexture(type, baseHex, seed) {
    seed = seed || 1;
    const size = 512;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const base = '#' + new THREE.Color(baseHex).getHexString();
    const dark = shadeColor(baseHex, 0.55);
    const darker = shadeColor(baseHex, 0.32);
    const light = lighten(baseHex, 0.3);
    const lighter = lighten(baseHex, 0.6);

    ctx.fillStyle = base;
    ctx.fillRect(0, 0, size, size);

    function speck(count, color, minR, maxR, aMin, aMax, withinR) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const rr = withinR ? Math.sqrt(Math.random()) * withinR * size / 2 : Math.random() * size / 2;
        const x = size / 2 + Math.cos(a) * rr;
        const y = size / 2 + Math.sin(a) * rr;
        const r = minR + Math.random() * (maxR - minR);
        ctx.globalAlpha = aMin + Math.random() * (aMax - aMin);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * (0.5 + Math.random() * 0.7), Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    if (type === 'turkey') {
      for (let i = 0; i < 14; i++) {
        ctx.strokeStyle = i % 2 ? dark : light;
        ctx.globalAlpha = 0.18;
        ctx.lineWidth = 3 + Math.random() * 4;
        ctx.beginPath();
        const y0 = (i / 14) * size + (Math.random() - 0.5) * 20;
        ctx.moveTo(0, y0);
        ctx.bezierCurveTo(size * 0.3, y0 + 30 * Math.sin(seed + i), size * 0.7, y0 - 30 * Math.cos(seed + i), size, y0);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      speck(50, darker, 1, 2.5, 0.25, 0.5, 0.98);
    } else if (type === 'cheese') {
      const g = ctx.createLinearGradient(0, 0, size, size);
      g.addColorStop(0, light); g.addColorStop(1, dark);
      ctx.globalAlpha = 0.5; ctx.fillStyle = g; ctx.fillRect(0, 0, size, size); ctx.globalAlpha = 1;
      speck(30, lighter, 6, 16, 0.05, 0.1, 0.85);
    } else if (type === 'avocado') {
      const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size * 0.52);
      g.addColorStop(0, lighter); g.addColorStop(0.55, base); g.addColorStop(1, darker);
      ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
      for (let i = 0; i < 40; i++) {
        const a = Math.random() * Math.PI * 2;
        ctx.strokeStyle = dark; ctx.globalAlpha = 0.12; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(size / 2, size / 2);
        ctx.lineTo(size / 2 + Math.cos(a) * size * 0.5, size / 2 + Math.sin(a) * size * 0.5);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (type === 'tomato') {
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.arc(size / 2, size / 2, size * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = base;
      ctx.beginPath(); ctx.arc(size / 2, size / 2, size * 0.44, 0, Math.PI * 2); ctx.fill();
      const seeds = 6;
      for (let i = 0; i < seeds; i++) {
        const a = (i / seeds) * Math.PI * 2 + seed;
        const cx = size / 2 + Math.cos(a) * size * 0.22;
        const cy = size / 2 + Math.sin(a) * size * 0.22;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.13);
        g.addColorStop(0, lighten(baseHex, 0.55));
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, size * 0.13, 0, Math.PI * 2); ctx.fill();
      }
    } else if (type === 'greens') {
      speck(6, light, size * 0.12, size * 0.2, 0.5, 0.7, 0.95);
      speck(6, dark, size * 0.1, size * 0.18, 0.4, 0.6, 0.95);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + seed;
        ctx.strokeStyle = lighter; ctx.globalAlpha = 0.25; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(size / 2, size / 2);
        ctx.quadraticCurveTo(size / 2 + Math.cos(a + 0.3) * size * 0.3, size / 2 + Math.sin(a + 0.3) * size * 0.3, size / 2 + Math.cos(a) * size * 0.48, size / 2 + Math.sin(a) * size * 0.48);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (type === 'mayo' || type === 'mustard') {
      const g = ctx.createLinearGradient(0, 0, size, size);
      g.addColorStop(0, lighter); g.addColorStop(0.5, base); g.addColorStop(1, light);
      ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
      ctx.strokeStyle = lighten(baseHex, 0.7); ctx.globalAlpha = 0.35; ctx.lineWidth = 14;
      ctx.beginPath(); ctx.moveTo(size * 0.1, size * 0.25); ctx.quadraticCurveTo(size * 0.5, size * 0.05, size * 0.9, size * 0.35); ctx.stroke();
      ctx.globalAlpha = 1;
      if (type === 'mayo') speck(25, '#5c7a3f', 2, 4, 0.3, 0.6, 0.85);
    } else if (type === 'grilled') {
      const g = ctx.createRadialGradient(size / 2, size / 2, size * 0.05, size / 2, size / 2, size * 0.52);
      g.addColorStop(0, lighten(baseHex, 0.15));
      g.addColorStop(0.6, base);
      g.addColorStop(1, dark);
      ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);

      speck(35, darker, 4, 14, 0.25, 0.55, 0.92);
      speck(50, dark, 2, 6, 0.2, 0.4, 0.95);

      ctx.save();
      ctx.translate(size / 2, size / 2);
      ctx.rotate(Math.PI / 5 + seed * 0.1);
      ctx.translate(-size / 2, -size / 2);
      const bandCount = 6;
      for (let i = 0; i < bandCount; i++) {
        const yPos = (i + 0.5) * (size / bandCount);
        const grad = ctx.createLinearGradient(0, yPos - 14, 0, yPos + 14);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(0.5, 'rgba(35,15,8,0.55)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(-size * 0.2, yPos - 14, size * 1.4, 28);
      }
      ctx.restore();

      const hi = ctx.createLinearGradient(size * 0.15, size * 0.1, size * 0.75, size * 0.5);
      hi.addColorStop(0, 'rgba(255,235,200,0.35)');
      hi.addColorStop(0.5, 'rgba(255,235,200,0.12)');
      hi.addColorStop(1, 'rgba(255,235,200,0)');
      ctx.fillStyle = hi;
      ctx.beginPath();
      ctx.ellipse(size * 0.4, size * 0.28, size * 0.28, size * 0.14, -0.4, 0, Math.PI * 2);
      ctx.fill();

      speck(18, '#ffffff', 1, 2.5, 0.3, 0.6, 0.7);
    }

    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  // Wraparound crust texture for buns (u = angle, v = height along profile)
  function makeCrustTexture(baseHex, seed) {
    const w = 1024, h = 256;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    const base = '#' + new THREE.Color(baseHex).getHexString();
    const dark = shadeColor(baseHex, 0.55);
    const darker = shadeColor(baseHex, 0.32);
    const light = lighten(baseHex, 0.25);

    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, light);
    g.addColorStop(0.6, base);
    g.addColorStop(1, dark);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    for (let i = 0; i < 500; i++) {
      const x = Math.random() * w;
      const y = Math.random() * h;
      const vFactor = y / h;
      ctx.globalAlpha = 0.08 + vFactor * 0.35 * Math.random();
      ctx.fillStyle = Math.random() > 0.3 ? darker : dark;
      const r = 1.5 + Math.random() * 4;
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 0.6, Math.random() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
      if (x < 40) { ctx.beginPath(); ctx.ellipse(x + w, y, r, r * 0.6, 0, 0, Math.PI * 2); ctx.fill(); }
      if (x > w - 40) { ctx.beginPath(); ctx.ellipse(x - w, y, r, r * 0.6, 0, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;

    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  function makeBlobLayer(radius, height, color, opts) {
    opts = opts || {};
    const edgeNoise = opts.edgeNoise !== undefined ? opts.edgeNoise : 0.08;
    const topBump = opts.topBump !== undefined ? opts.topBump : 0.04;
    const seed = opts.seed || Math.random() * 10;
    const segs = 56;

    const geo = new THREE.CylinderGeometry(radius, radius * 0.95, height, segs, 3, false);
    const pos = geo.attributes.position;
    const halfH = height / 2;

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const angle = Math.atan2(z, x);
      const edgeFactor = 1 + noise1(angle, seed) * edgeNoise;
      pos.setXYZ(i, x * edgeFactor, y, z * edgeFactor);
    }
    geo.computeVertexNormals();

    const roughness = opts.roughness !== undefined ? opts.roughness : 0.65;
    const metalness = opts.metalness !== undefined ? opts.metalness : 0.03;
    const sideMat = new THREE.MeshStandardMaterial({
      color: shadeColor(color, 0.72),
      roughness, metalness,
      emissive: new THREE.Color(color).multiplyScalar(0.025),
    });

    const holder = new THREE.Group();
    holder.add(new THREE.Mesh(geo, [sideMat, sideMat, sideMat]));

    // Real bumpy top surface, textured if this ingredient has a texture type
    let topMat;
    if (opts.textureType) {
      const tex = makeFoodTexture(opts.textureType, color, opts.seed || 1);
      topMat = new THREE.MeshStandardMaterial({ map: tex, roughness, metalness, emissive: new THREE.Color(color).multiplyScalar(0.025) });
    } else {
      topMat = new THREE.MeshStandardMaterial({ color, roughness, metalness, emissive: new THREE.Color(color).multiplyScalar(0.025) });
    }
    applyPhotoIfProvided(topMat, opts.photo, false);
    const topDisc = makeTopDisc(radius * 0.99, halfH + 0.004, 48, 8, topBump, edgeNoise, seed, topMat);
    holder.add(topDisc);

    return holder;
  }

  // A properly subdivided disc (concentric rings, not a single-center fan) so bump
  // noise can actually vary across the whole face, not just the outer rim.
  function makeTopDisc(radius, yOffset, segsAngular, segsRadial, bumpAmp, edgeNoise, seed, material) {
    const positions = [];
    const uvs = [];
    const indices = [];
    const ringVerts = [];

    positions.push(0, yOffset, 0);
    uvs.push(0.5, 0.5);
    ringVerts.push([0]);

    let vIndex = 1;
    for (let r = 1; r <= segsRadial; r++) {
      const rt = r / segsRadial;
      const ring = [];
      for (let a = 0; a < segsAngular; a++) {
        const theta = (a / segsAngular) * Math.PI * 2;
        const edgeFactor = 1 + noise1(theta, seed) * edgeNoise * rt;
        const rad = radius * rt * edgeFactor;
        const x = Math.cos(theta) * rad;
        const z = Math.sin(theta) * rad;
        const bump = (Math.sin(x * 6.3 + seed * 3) * Math.sin(z * 5.1 - seed * 2) * 0.55
                    + Math.sin((x + z) * 9.4 + seed * 1.3) * 0.3
                    + Math.sin(x * 14.2 - z * 12.7 + seed) * 0.2) * bumpAmp * rt;
        positions.push(x, yOffset + bump, z);
        uvs.push(0.5 + (x / radius) * 0.5, 0.5 + (z / radius) * 0.5);
        ring.push(vIndex++);
      }
      ringVerts.push(ring);
    }

    const ring1 = ringVerts[1];
    for (let a = 0; a < segsAngular; a++) {
      const a2 = (a + 1) % segsAngular;
      indices.push(0, ring1[a2], ring1[a]);
    }
    for (let r = 1; r < segsRadial; r++) {
      const ringA = ringVerts[r], ringB = ringVerts[r + 1];
      for (let a = 0; a < segsAngular; a++) {
        const a2 = (a + 1) % segsAngular;
        indices.push(ringA[a], ringB[a2], ringB[a]);
        indices.push(ringA[a], ringA[a2], ringB[a2]);
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setIndex(indices);
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.computeVertexNormals();

    material.side = THREE.DoubleSide; // guards against winding-direction guesses being wrong
    return new THREE.Mesh(geo, material);
  }

  function makeBun(radius, height, color, flip, seed, photoUrl) {
    const pts = [];
    const steps = 10;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const y = t * height;
      const r = radius * Math.sin((Math.PI / 2) * (1 - t * 0.92));
      pts.push(new THREE.Vector2(Math.max(r, 0.001), y));
    }
    const geo = new THREE.LatheGeometry(pts, 48);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const angle = Math.atan2(z, x);
      const ridge = Math.sin(angle * 8 + seed) * 0.06 + Math.sin(angle * 17 - seed) * 0.03 + Math.sin(y * 14 + angle * 3) * 0.025;
      const factor = 1 + ridge;
      pos.setXYZ(i, x * factor, flip ? -y : y, z * factor);
    }
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      map: makeCrustTexture(color, seed),
      roughness: 0.82, metalness: 0.02,
      emissive: new THREE.Color(color).multiplyScalar(0.03),
    });
    applyPhotoIfProvided(mat, photoUrl, true);
    return new THREE.Mesh(geo, mat);
  }

  function makeLabelTexture(text) {
    const canvasEl = document.createElement('canvas');
    const ctx = canvasEl.getContext('2d');
    const scale = 4;
    const fontSize = 30 * scale;
    ctx.font = `${fontSize}px Georgia, serif`;
    const width = ctx.measureText(text).width + 40 * scale;
    const height = fontSize * 1.6;
    canvasEl.width = width;
    canvasEl.height = height;
    ctx.font = `${fontSize}px Georgia, serif`;
    ctx.fillStyle = 'rgba(242, 230, 200, 0.95)';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 20 * scale, height / 2);
    const texture = new THREE.CanvasTexture(canvasEl);
    texture.minFilter = THREE.LinearFilter;
    return { texture, aspect: width / height };
  }

  function makeLabel(text) {
    const { texture, aspect } = makeLabelTexture(text);
    const mat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
    const sprite = new THREE.Sprite(mat);
    const h = 0.5;
    sprite.scale.set(h * aspect, h, 1);
    return sprite;
  }

  function updateLabelText(sprite, text) {
    const old = sprite.material.map;
    const { texture, aspect } = makeLabelTexture(text);
    sprite.material.map = texture;
    sprite.material.needsUpdate = true;
    if (old) old.dispose();
    const h = 0.5;
    sprite.scale.set(h * aspect, h, 1);
  }

  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // ---------- Layer instance factories ----------
  let uidCounter = 0;

  function createFillingInstance(def) {
    const g = new THREE.Group();
    const model = modelCache[def.id];

    if (model && model.ready) {
      g.add(model.root.clone());
    } else {
      g.add(makeBlobLayer(def.radius, def.height, def.color, def));

      if (def.holes) {
        for (let h = 0; h < 6; h++) {
          const a = Math.random() * Math.PI * 2;
          const r = Math.random() * def.radius * 0.6;
          const hole = new THREE.Mesh(
            new THREE.CylinderGeometry(0.09 + Math.random() * 0.1, 0.09 + Math.random() * 0.1, 0.04, 16),
            new THREE.MeshStandardMaterial({ color: 0x8a6a1f, roughness: 0.8 })
          );
          hole.position.set(Math.cos(a) * r, def.height / 2 - 0.02, Math.sin(a) * r);
          g.add(hole);
        }
      }
    }

    const label = makeLabel(def.name);
    label.position.set(def.radius + 1.15, 0, 0);
    label.visible = false;
    g.add(label);

    g.userData = {
      uid: 'f' + (uidCounter++), ingredientId: def.id, height: def.height, category: def.category,
      targetY: 0, spawning: true, spawnT: 0, removing: false, removeT: 0,
      labelSprite: label, labelText: '',
    };
    g.scale.set(0.001, 0.001, 0.001);
    return g;
  }

  function createBunPair(breadDef) {
    const model = modelCache[breadDef.id];
    const useModel = model && model.ready;

    // makeBun/model bun halves are built flat-face-at-y=0 (bottom spans [-h,0],
    // top spans [0,h]) since that's the natural anchor for a cut half. layoutStack
    // instead centers every layer's group on its own origin ([-h/2,h/2]), so shift
    // each half by half its height to match that convention — otherwise the bun
    // ends up offset by h/2 from where the stack thinks it is, opening up an extra
    // gap (worst on the tall top bun) that the other layers don't have.
    const bottom = new THREE.Group();
    const bottomMesh = useModel ? model.bottomMesh.clone() : makeBun(breadDef.radius, breadDef.bottomHeight, breadDef.bottomColor || breadDef.color, true, 3.3, breadDef.photo);
    bottomMesh.position.y += breadDef.bottomHeight / 2;
    bottom.add(bottomMesh);
    bottom.userData = {
      uid: 'bun-bottom-' + (uidCounter++), ingredientId: breadDef.id, height: breadDef.bottomHeight, category: 'bread-bottom',
      targetY: 0, spawning: true, spawnT: 0, removing: false, removeT: 0, labelSprite: null,
    };
    bottom.scale.set(0.001, 0.001, 0.001);

    const top = new THREE.Group();
    const topMesh = useModel ? model.topMesh.clone() : makeBun(breadDef.radius, breadDef.topHeight, breadDef.color, false, 1.1, breadDef.photo);
    topMesh.position.y -= breadDef.topHeight / 2;
    top.add(topMesh);
    const label = makeLabel(breadDef.name);
    label.position.set(breadDef.radius + 1.15, 0, 0);
    top.add(label);
    top.userData = {
      uid: 'bun-top-' + (uidCounter++), ingredientId: breadDef.id, height: breadDef.topHeight, category: 'bread-top',
      targetY: 0, spawning: true, spawnT: 0, removing: false, removeT: 0, labelSprite: label, labelText: breadDef.name,
    };
    top.scale.set(0.001, 0.001, 0.001);

    return { bottom, top };
  }

  // ---------- Stack management ----------
  let allGroups = [];
  let bottomBunGroup = null, topBunGroup = null, currentBreadId = null;

  function swapBunPair(breadDef) {
    if (bottomBunGroup) bottomBunGroup.userData.removing = true;
    if (topBunGroup) topBunGroup.userData.removing = true;
    const pair = createBunPair(breadDef);
    group.add(pair.bottom); group.add(pair.top);
    allGroups.push(pair.bottom, pair.top);
    bottomBunGroup = pair.bottom;
    topBunGroup = pair.top;
    layoutStack();
  }

  // Called once a queued GLB finishes loading, to swap it in for whatever
  // procedural placeholder is already on screen for that ingredient.
  function refreshIngredientInstances(def) {
    if (def.category === 'bread') {
      if (currentBreadId === def.id) swapBunPair(def);
      return;
    }
    const existing = allGroups.filter(g => g.userData.ingredientId === def.id && !g.userData.removing);
    if (!existing.length) return;
    existing.forEach(g => { g.userData.removing = true; });
    existing.forEach(() => {
      const inst = createFillingInstance(def);
      group.add(inst);
      allGroups.push(inst);
    });
    layoutStack();
  }

  function syncStackWithState() {
    const breadDef = CATALOG.find(d => d.category === 'bread' && qty[d.id] > 0) || CATALOG.find(d => d.default);
    if (breadDef.id !== currentBreadId) {
      currentBreadId = breadDef.id;
      loadModelIfProvided(breadDef);
      swapBunPair(breadDef);
    }

    CATALOG.filter(d => d.category !== 'bread').forEach(def => {
      const desired = qty[def.id] || 0;
      const existing = allGroups.filter(g => g.userData.ingredientId === def.id && !g.userData.removing);
      if (existing.length < desired) {
        loadModelIfProvided(def);
        for (let i = existing.length; i < desired; i++) {
          const inst = createFillingInstance(def);
          group.add(inst);
          allGroups.push(inst);
        }
      } else if (existing.length > desired) {
        existing.slice(desired).forEach(g => { g.userData.removing = true; });
      }
    });

    layoutStack();
  }

  function layoutStack() {
    const fillings = allGroups.filter(g => !g.userData.removing && g.userData.category !== 'bread-top' && g.userData.category !== 'bread-bottom');
    fillings.sort((a, b) => {
      const ca = STACK_ORDER.indexOf(a.userData.category);
      const cb = STACK_ORDER.indexOf(b.userData.category);
      if (ca !== cb) return ca - cb;
      const ia = CATALOG.findIndex(d => d.id === a.userData.ingredientId);
      const ib = CATALOG.findIndex(d => d.id === b.userData.ingredientId);
      if (ia !== ib) return ia - ib;
      return a.userData.uid < b.userData.uid ? -1 : 1;
    });

    const order = [];
    if (bottomBunGroup && !bottomBunGroup.userData.removing) order.push(bottomBunGroup);
    order.push(...fillings);
    if (topBunGroup && !topBunGroup.userData.removing) order.push(topBunGroup);

    const gap = 0.22;
    const totalHeight = order.reduce((s, g) => s + g.userData.height, 0) + gap * Math.max(0, order.length - 1);
    let cursor = -totalHeight / 2;
    const seen = new Set();

    order.forEach(g => {
      const h = g.userData.height;
      g.userData.targetY = cursor + h / 2;
      cursor += h + gap;

      if (g.userData.labelSprite && g.userData.category !== 'bread-top') {
        const id = g.userData.ingredientId;
        if (!seen.has(id)) {
          seen.add(id);
          const count = qty[id] || 1;
          const def = CATALOG.find(d => d.id === id);
          const text = count > 1 ? `${def.name} \u00d7${count}` : def.name;
          if (g.userData.labelText !== text) {
            updateLabelText(g.userData.labelSprite, text);
            g.userData.labelText = text;
          }
          g.userData.labelSprite.visible = true;
        } else {
          g.userData.labelSprite.visible = false;
        }
      }
    });
  }

  // ---------- Ambient dust ----------
  const dustGeo = new THREE.BufferGeometry();
  const dustCount = 70;
  const dustPos = new Float32Array(dustCount * 3);
  for (let i = 0; i < dustCount; i++) {
    const r = 4 + Math.random() * 3;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 2 - 1);
    dustPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    dustPos[i * 3 + 1] = r * Math.cos(phi) * 0.6;
    dustPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xd9c07a, size: 0.035, transparent: true, opacity: 0.5, sizeAttenuation: true }));
  scene.add(dust);

  // ---------- Interaction ----------
  let isDragging = false, prevX = 0, prevY = 0, lastInteraction = Date.now(), velocityX = 0;

  // Two-finger pinch-to-zoom for touch. Mouse wheel (below) only fires on
  // desktop, so without this, phones/tablets have no way to zoom at all.
  const activePointers = new Map();
  let pinchStartDist = null, pinchStartZ = null;

  canvas.addEventListener('pointerdown', (e) => {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activePointers.size >= 2) {
      isDragging = false; canvas.classList.remove('dragging');
      const [a, b] = [...activePointers.values()];
      pinchStartDist = Math.hypot(a.x - b.x, a.y - b.y);
      pinchStartZ = camera.position.z;
    } else {
      isDragging = true; canvas.classList.add('dragging');
      prevX = e.clientX; prevY = e.clientY;
    }
    lastInteraction = Date.now();
  });
  window.addEventListener('pointermove', (e) => {
    if (!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    lastInteraction = Date.now();

    if (activePointers.size >= 2) {
      const [a, b] = [...activePointers.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchStartDist) camera.position.z = Math.max(6, Math.min(15, pinchStartZ * (pinchStartDist / dist)));
      return;
    }

    if (!isDragging) return;
    const dx = e.clientX - prevX, dy = e.clientY - prevY;
    prevX = e.clientX; prevY = e.clientY;
    group.rotation.y += dx * 0.006;
    group.rotation.x = Math.max(-0.6, Math.min(0.6, group.rotation.x + dy * 0.006));
    velocityX = dx * 0.006;
  });
  const releasePointer = (e) => {
    activePointers.delete(e.pointerId);
    pinchStartDist = null;
    isDragging = activePointers.size === 1;
    if (!isDragging) canvas.classList.remove('dragging');
    else { const [p] = [...activePointers.values()]; prevX = p.x; prevY = p.y; }
    lastInteraction = Date.now();
  };
  window.addEventListener('pointerup', releasePointer);
  window.addEventListener('pointercancel', releasePointer);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    camera.position.z = Math.max(6, Math.min(15, camera.position.z + e.deltaY * 0.006));
    lastInteraction = Date.now();
  }, { passive: false });

  // Also called once when entering the app view (see enterApp below): #app
  // starts hidden behind the login screen, so #scene-container is 0×0 at boot
  // and the renderer/camera need a real resize once it actually becomes visible.
  function handleResize() {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  }
  window.addEventListener('resize', handleResize);

  // ---------- Animate ----------
  function animate() {
    requestAnimationFrame(animate);

    if (!isDragging) {
      const idle = Date.now() - lastInteraction;
      if (idle > 1200) group.rotation.y += 0.0022;
      else { group.rotation.y += velocityX; velocityX *= 0.9; }
    }
    dust.rotation.y += 0.0006;

    for (let i = allGroups.length - 1; i >= 0; i--) {
      const g = allGroups[i];
      const ud = g.userData;

      if (ud.spawning) {
        ud.spawnT = Math.min(1, ud.spawnT + 0.05);
        const s = Math.max(0, easeOutBack(ud.spawnT));
        g.scale.set(s, s, s);
        if (ud.spawnT >= 1) { ud.spawning = false; g.scale.set(1, 1, 1); }
      } else if (ud.removing) {
        ud.removeT = Math.min(1, ud.removeT + 0.07);
        const s = Math.max(0, 1 - ud.removeT);
        g.scale.set(s, s, s);
        if (ud.removeT >= 1) { group.remove(g); allGroups.splice(i, 1); continue; }
      }

      g.position.y += (ud.targetY - g.position.y) * 0.15;
    }

    renderer.render(scene, camera);
  }

  // ============================================================
  // Auth / views
  // ============================================================
  function showView(view) {
    document.getElementById('login-screen').classList.toggle('view-hidden', view !== 'login');
    document.getElementById('app').classList.toggle('view-hidden', view !== 'app');
    document.getElementById('admin-view').classList.toggle('view-hidden', view !== 'admin');
  }

  // Enters the app for the currently logged-in user/admin: shows the right
  // view and (re)initializes whatever that view needs, since #app/#admin-view
  // start hidden and can't do real layout work (like sizing the 3D canvas)
  // until they're actually visible.
  function enterApp() {
    document.getElementById('user-username-label').textContent = currentUser;
    document.getElementById('admin-username-label').textContent = currentUser;
    if (currentRole === 'admin') {
      showView('admin');
      renderAdminOrderLog();
    } else {
      showView('app');
      Object.keys(qty).forEach(id => { qty[id] = defaultQty[id] || 0; });
      renderPanel();
      syncStackWithState();
      handleResize();
    }
  }

  function attemptLogin(username, password) {
    username = username.trim();
    if (!username || !password) return 'Enter a username and password.';

    const existing = accounts[username];
    if (existing) {
      if (existing.password !== password) return 'Wrong password.';
    } else {
      accounts[username] = { password, role: 'user' };
      saveJSON(STORAGE_KEYS.accounts, accounts);
    }

    currentUser = username;
    currentRole = accounts[username].role;
    saveJSON(STORAGE_KEYS.session, { username: currentUser, role: currentRole });
    return null;
  }

  function logout() {
    currentUser = null;
    currentRole = null;
    localStorage.removeItem(STORAGE_KEYS.session);
    document.getElementById('login-username').value = '';
    document.getElementById('login-password').value = '';
    document.getElementById('login-error').textContent = '';
    showView('login');
  }

  function initAuth() {
    const session = loadJSON(STORAGE_KEYS.session, null);
    if (session && accounts[session.username]) {
      currentUser = session.username;
      currentRole = accounts[session.username].role;
      enterApp();
    } else {
      showView('login');
    }
  }

  // ============================================================
  // UI panel
  // ============================================================
  function calcTotals() {
    let price = 0, calories = 0;
    CATALOG.forEach(d => {
      const q = qty[d.id] || 0;
      if (d.category === 'bread') {
        if (q > 0) { price += d.price; calories += d.calories; }
      } else {
        price += d.price * q;
        calories += d.calories * q;
      }
    });
    return { price, calories };
  }

  // Builds the admin-facing order label from a qty snapshot: always "Original"
  // plus/minus whatever differs from defaultQty, regardless of any name the
  // user saved their sandwich under.
  function computeOrderLabel(qtySnapshot) {
    const parts = [];

    const selectedBread = CATALOG.find(d => d.category === 'bread' && (qtySnapshot[d.id] || 0) > 0);
    const defaultBread = CATALOG.find(d => d.category === 'bread' && (defaultQty[d.id] || 0) > 0);
    if (selectedBread && defaultBread && selectedBread.id !== defaultBread.id) {
      parts.push(`Bread: ${selectedBread.name}`);
    }

    CATALOG.filter(d => d.category !== 'bread').forEach(d => {
      const delta = (qtySnapshot[d.id] || 0) - (defaultQty[d.id] || 0);
      if (delta > 0) parts.push(`+ ${d.name}${delta > 1 ? ' ×' + delta : ''}`);
      else if (delta < 0) parts.push(`− ${d.name}${Math.abs(delta) > 1 ? ' ×' + Math.abs(delta) : ''}`);
    });

    return parts.length ? 'Original ' + parts.join(', ') : 'Original';
  }

  // Renders the logged-in user's saved sandwiches as a name input + Save
  // button, plus one clickable chip per saved name. Names are free-text user
  // input, so they're escaped before landing in innerHTML.
  function renderSavedSandwichesHtml() {
    const mine = savedSandwiches[currentUser] || {};
    const names = Object.keys(mine);
    let html = `<div class="cat-group my-sandwiches"><h3>My Sandwiches</h3>
      <div class="save-row">
        <input id="sandwich-name-input" type="text" placeholder="Name this sandwich" maxlength="40" />
        <button data-action="save-sandwich">Save</button>
      </div>`;
    names.forEach(name => {
      html += `
        <button class="chip bread-chip saved-chip" data-action="load-sandwich" data-name="${escapeHtml(name)}">
          <span class="chip-name">${escapeHtml(name)}</span>
        </button>`;
    });
    html += `</div>`;
    return html;
  }

  function renderPanel() {
    const scroll = document.getElementById('panel-scroll');
    let html = renderSavedSandwichesHtml();
    CATEGORY_DISPLAY_ORDER.forEach(cat => {
      const items = CATALOG.filter(d => d.category === cat);
      html += `<div class="cat-group"><h3>${CATEGORY_LABELS[cat]}</h3>`;
      items.forEach(d => {
        const q = qty[d.id] || 0;
        if (cat === 'bread') {
          html += `
            <button class="chip bread-chip ${q > 0 ? 'active' : ''}" data-action="select-bread" data-id="${d.id}">
              <span class="chip-name">${d.name}</span>
              <span class="chip-price">${d.price > 0 ? '+' + CONFIG.currency + ' ' + d.price : 'Included'}</span>
            </button>`;
        } else {
          html += `
            <div class="chip">
              <div class="chip-info">
                <span class="chip-name">${d.name}</span>
                <span class="chip-price">${CONFIG.currency} ${d.price}</span>
              </div>
              <div class="stepper">
                <button data-action="decrement" data-id="${d.id}" ${q === 0 ? 'disabled' : ''}>&minus;</button>
                <span class="stepper-qty">${q}</span>
                <button data-action="increment" data-id="${d.id}" ${q >= MAX_QTY ? 'disabled' : ''}>+</button>
              </div>
            </div>`;
        }
      });
      html += `</div>`;
    });
    scroll.innerHTML = html;

    const totals = calcTotals();
    document.getElementById('total-price').textContent = `${CONFIG.currency} ${totals.price}`;
    document.getElementById('total-calories').textContent = `${totals.calories} kcal`;
  }

  // Saves a copy of the current qty selection under `name` for the logged-in
  // user (overwrites if the name is reused). Bread is just another entry in
  // qty, so no separate field is needed to capture it.
  function saveSandwich(name) {
    if (!name) return;
    if (!savedSandwiches[currentUser]) savedSandwiches[currentUser] = {};
    savedSandwiches[currentUser][name] = { qty: { ...qty }, savedAt: new Date().toISOString() };
    saveJSON(STORAGE_KEYS.saved, savedSandwiches);
  }
  function loadSandwich(name) {
    const saved = savedSandwiches[currentUser] && savedSandwiches[currentUser][name];
    if (!saved) return;
    Object.keys(qty).forEach(id => { qty[id] = saved.qty[id] || 0; });
  }

  document.getElementById('panel-scroll').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;

    if (action === 'select-bread') {
      CATALOG.filter(d => d.category === 'bread').forEach(d => { qty[d.id] = 0; });
      qty[id] = 1;
    } else if (action === 'increment') {
      qty[id] = Math.min(MAX_QTY, (qty[id] || 0) + 1);
    } else if (action === 'decrement') {
      qty[id] = Math.max(0, (qty[id] || 0) - 1);
    } else if (action === 'save-sandwich') {
      const input = document.getElementById('sandwich-name-input');
      saveSandwich(input.value.trim());
    } else if (action === 'load-sandwich') {
      loadSandwich(btn.dataset.name);
    }

    renderPanel();
    syncStackWithState();
  });

  document.getElementById('send-order').addEventListener('click', async () => {
    const totals = calcTotals();
    const items = CATALOG.filter(d => (qty[d.id] || 0) > 0).map(d => ({
      id: d.id, name: d.name, quantity: d.category === 'bread' ? 1 : qty[d.id], unit_price: d.price,
    }));
    const payload = { table: tableId, items, total_price: totals.price, total_calories: totals.calories, timestamp: new Date().toISOString() };

    // Recorded unconditionally (not gated on the webhook succeeding) using the
    // normalized "Original ± diff" label — never whatever name the user saved
    // their sandwich under — so the admin log always shows what to actually
    // make, and still works while CONFIG.webhookUrl is a placeholder.
    orderLog.unshift({
      id: 'order-' + Date.now(), username: currentUser, label: computeOrderLabel(qty),
      items, totalPrice: totals.price, totalCalories: totals.calories,
      table: tableId, timestamp: payload.timestamp,
    });
    saveJSON(STORAGE_KEYS.orders, orderLog);

    const statusEl = document.getElementById('order-status');

    // CONFIG.webhookUrl is still the unconfigured placeholder — this is a
    // prototype with no real kitchen system to POST to, so skip the network
    // call entirely rather than showing a permanent, confusing "unreachable"
    // error. The order is already recorded above regardless. Once a real
    // n8n webhook URL is set in CONFIG, this switches to actually sending it.
    if (!CONFIG.webhookUrl || CONFIG.webhookUrl.includes('your-n8n-instance.example.com')) {
      console.log('Order recorded (no webhook configured):', payload);
      statusEl.textContent = 'Order recorded';
      statusEl.className = 'status-ok';
      return;
    }

    statusEl.textContent = 'Sending...';
    statusEl.className = 'status-sending';

    try {
      const res = await fetch(CONFIG.webhookUrl, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error('Bad response: ' + res.status);
      statusEl.textContent = 'Order sent to the kitchen';
      statusEl.className = 'status-ok';
    } catch (err) {
      console.log('Order payload (webhook not reachable):', payload);
      statusEl.textContent = 'Could not reach the kitchen — check CONFIG.webhookUrl';
      statusEl.className = 'status-error';
    }
  });

  // Renders every order across all users, newest first (orderLog entries are
  // unshifted, so no sort needed here), always using the normalized diff
  // label rather than any name a user saved their sandwich under.
  function renderAdminOrderLog() {
    const list = document.getElementById('admin-order-list');
    if (!orderLog.length) {
      list.innerHTML = '<div id="admin-empty">No orders yet.</div>';
      return;
    }
    let html = '<table><thead><tr><th>Time</th><th>User</th><th>Table</th><th>Order</th><th>Total</th><th>Kcal</th></tr></thead><tbody>';
    orderLog.forEach(o => {
      html += `<tr>
        <td>${escapeHtml(new Date(o.timestamp).toLocaleString())}</td>
        <td>${escapeHtml(o.username || '')}</td>
        <td>${escapeHtml(o.table || '—')}</td>
        <td>${escapeHtml(o.label)}</td>
        <td>${CONFIG.currency} ${o.totalPrice}</td>
        <td>${o.totalCalories} kcal</td>
      </tr>`;
    });
    html += '</tbody></table>';
    list.innerHTML = html;
  }

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const error = attemptLogin(
      document.getElementById('login-username').value,
      document.getElementById('login-password').value
    );
    if (error) { document.getElementById('login-error').textContent = error; return; }
    document.getElementById('login-error').textContent = '';
    enterApp();
  });
  document.getElementById('user-logout-btn').addEventListener('click', logout);
  document.getElementById('admin-logout-btn').addEventListener('click', logout);

  // ---------- Boot ----------
  CATALOG.forEach(loadModelIfProvided);
  animate();
  initAuth(); // shows the login screen, or calls enterApp() straight away if a session already exists
})();
</script>
</body>
</html>
