<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order from your table</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --brand: #3DAE2B; --brand-soft: #e9f6e6; --ink: #14171a; --bg: #f6f7f4; --card: #fff; --muted: #6b7280; --ease: cubic-bezier(.2,.8,.2,1); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 560px; margin: 0 auto; background: var(--card); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--brand); color: #fff; }
  header img { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; background: rgba(255,255,255,.2); box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  header .t { flex: 1; min-width: 0; }
  header .name { font-weight: 800; font-size: 16px; }
  header .sub { font-size: 12.5px; opacity: .9; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.18); white-space: nowrap; transition: background .3s; }
  .pill.ok { background: rgba(255,255,255,.95); color: #1f7a16; }
  .pill.warn { background: #fff3e0; color: #a35a00; }
  #log { flex: 1; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(180deg, var(--bg), #fff 40%); scroll-behavior: smooth; }
  .row { display: flex; gap: 8px; align-items: flex-end; animation: in .32s var(--ease) both; }
  .row.me { justify-content: flex-end; }
  .av { flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 13px; }
  .msg { max-width: 84%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; unicode-bidi: plaintext; text-align: start; }
  /* each line takes its own direction from its first letter, so an Arabic bill with English dish names reads in order */
  .ai .msg { background: #fff; border: 1px solid rgba(0,0,0,.07); border-bottom-left-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.03); }
  .me .msg { background: var(--brand); color: #fff; border-bottom-right-radius: 6px; }
  .sys { align-self: center; color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; animation: in .3s both; }
  .msg img { max-width: 100%; border-radius: 12px; display: block; margin-top: 8px; }
  .msg a { color: inherit; font-weight: 600; }
  .msg .doc { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; padding: 8px 12px; border-radius: 12px; background: var(--brand-soft); color: #1f7a16; text-decoration: none; }
  .msg .rule { display: block; height: 1px; background: rgba(0,0,0,.1); margin: 6px 0; }
  .msg .ticket { display: flex; align-items: center; gap: 8px; font-weight: 800; color: #1f7a16; }
  @keyframes in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .typing .msg { display: inline-flex; gap: 4px; padding: 14px 16px; }
  .typing .msg span { width: 7px; height: 7px; border-radius: 50%; background: #b9c0c7; animation: dot 1.2s infinite; }
  .typing .msg span:nth-child(2) { animation-delay: .15s; } .typing .msg span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 14px 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--brand); color: var(--brand); background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; animation: in .3s var(--ease) both; transition: background .2s, color .2s, transform .15s; }
  .chip:active { transform: scale(.96); }
  .quick { display: flex; gap: 8px; padding: 0 14px 8px; overflow-x: auto; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--bg); border: 1px solid rgba(0,0,0,.08); border-radius: 999px; padding: 7px 12px; cursor: pointer; transition: border-color .2s, transform .15s; }
  .quick button i { color: var(--brand); }
  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(0,0,0,.06); background: #fff; }
  input { flex: 1; font: inherit; padding: 12px 16px; border: 1.5px solid #e3e5e8; border-radius: 999px; outline: none; transition: border-color .2s, box-shadow .2s; }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  button.send { width: 46px; height: 46px; flex: 0 0 46px; color: #fff; background: var(--brand); border: 0; border-radius: 50%; cursor: pointer; font-size: 17px; transition: transform .2s var(--ease), opacity .2s; }
 button.send:disabled { opacity: .45; transform: none; }
  .gate { margin: auto; padding: 30px 24px; text-align: center; color: var(--muted); animation: in .4s both; }
  .gate i { font-size: 44px; color: var(--brand); } .gate h2 { color: var(--ink); font-size: 19px; margin: 14px 0 6px; }
  .banner { display: flex; align-items: center; gap: 10px; margin: 10px 14px 0; padding: 10px 12px; border-radius: 14px; background: var(--brand-soft); color: #1f5f17; font-size: 13.5px; animation: in .35s both; }
  .banner b { font-size: 16px; letter-spacing: .18em; color: var(--ink); }
  .banner i { color: var(--brand); font-size: 16px; }
  .banner button { margin-left: auto; font: inherit; font-weight: 700; font-size: 12.5px; color: var(--brand); background: #fff; border: 0; border-radius: 999px; padding: 6px 10px; cursor: pointer; }
  .card { margin: 4px 0 4px 36px; padding: 14px; border-radius: 18px; background: #fff; border: 1.5px solid var(--brand-soft); box-shadow: 0 6px 18px rgba(0,0,0,.05); animation: in .35s both; }
  .card h4 { margin: 0 0 4px; font-size: 15px; display: flex; gap: 8px; align-items: center; } .card h4 i { color: var(--brand); }
  .card p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .card .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .card .wa { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; color: #fff; background: #25D366; border-radius: 999px; padding: 9px 14px; font-size: 14px; }
  .card .skip { font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 9px 6px; }
  .gate .code { display: flex; gap: 8px; justify-content: center; margin: 16px 0 8px; }
  .gate .code input { width: 150px; text-align: center; font-size: 22px; letter-spacing: .4em; padding: 10px; border-radius: 14px; }
  .gate .go { font: inherit; font-weight: 700; color: #fff; background: var(--brand); border: 0; border-radius: 14px; padding: 0 16px; cursor: pointer; }
  .gate .mine { margin-top: 14px; font: inherit; font-weight: 700; color: #a35a00; background: #fff3e0; border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
  .gate .err { color: #b42318; font-size: 13px; min-height: 18px; }
  .hbtn { width: 38px; height: 38px; border-radius: 12px; border: 0; background: rgba(255,255,255,.18); color: #fff; font-size: 16px; cursor: pointer; transition: background .2s, transform .15s; }
 .hbtn:active { transform: scale(.94); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(10,12,14,.38); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 50%; bottom: 0; width: min(560px, 100vw); transform: translate(-50%, 100%); z-index: 41; background: #fff; border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.18); transition: transform .32s var(--ease); max-height: 86dvh; display: flex; flex-direction: column; }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: #d6d9dd; margin: 10px auto 4px; }
  .sheet h3 { margin: 6px 18px 10px; font-size: 17px; display: flex; align-items: center; gap: 8px; } .sheet h3 i { color: var(--brand); }
  .sheet h3 .x { margin-left: auto; font: inherit; background: none; border: 0; font-size: 18px; color: var(--muted); cursor: pointer; }
  .calls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 18px 22px; }
  .calls button { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; border-radius: 16px; border: 1.5px solid #eceef0; background: #fff; font: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; transition: border-color .2s, transform .15s; }
  .calls button i { font-size: 22px; color: var(--brand); }
  .sheet > * { flex-shrink: 0; } .sheet > .mlist { flex: 1 1 auto; min-height: 0; }
  .mtabs { display: flex; gap: 8px; overflow-x: auto; padding: 0 18px 10px; scrollbar-width: none; } .mtabs::-webkit-scrollbar { display: none; }
  .mtabs button { flex: 0 0 auto; font: inherit; font-size: 13px; font-weight: 700; padding: 8px 13px; border-radius: 999px; border: 1.5px solid #eceef0; background: #fff; cursor: pointer; }
  .mtabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .msearch { margin: 0 18px 10px; position: relative; } .msearch i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .msearch input { width: 100%; padding-left: 38px; border-radius: 14px; }
  .mlist { overflow-y: auto; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 8px; }
  .mi { display: grid; grid-template-columns: 54px 1fr auto 34px; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; border: 1px solid #eef0f2; animation: in .3s var(--ease) both; }
  .mi .ph { width: 54px; height: 54px; border-radius: 14px; background: var(--brand-soft) center/cover no-repeat; display: grid; place-items: center; color: var(--brand); font-size: 20px; }
  .mi b { font-size: 14.5px; } .mi small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; margin-top: 2px; }
  .mi .pr { font-weight: 800; font-size: 14px; text-align: right; } .mi .pr span { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .mi .add { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--brand); color: #fff; cursor: pointer; transition: transform .2s var(--ease); }
  .mi.off { opacity: .45; } .mi.off .add { display: none; }
  .mi .badge { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; font-weight: 700; color: #a35a00; background: #fff3e0; border-radius: 999px; padding: 2px 7px; margin-left: 6px; }
  .mi .best { color: #1f7a16; background: var(--brand-soft); }
  .tracker { margin: 4px 0 4px 36px; padding: 12px 14px; border-radius: 18px; background: #fff; border: 1.5px solid var(--brand-soft); animation: in .35s both; }
  .tracker .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 10px; } .tracker .top b { color: var(--ink); }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .steps div { text-align: center; font-size: 11.5px; color: var(--muted); }
  .steps i { display: grid; place-items: center; width: 30px; height: 30px; margin: 0 auto 4px; border-radius: 50%; background: #f1f2f4; color: #b5bac1; transition: background .4s, color .4s; }
  .steps .done i { background: var(--brand); color: #fff; } .steps .done { color: var(--ink); font-weight: 700; }
  .steps .now i { background: var(--brand); color: #fff; box-shadow: 0 0 0 0 rgba(61,174,43,.5); animation: pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(61,174,43,0); } 100% { box-shadow: 0 0 0 0 rgba(61,174,43,0); } }
  .stars { display: flex; gap: 6px; margin: 4px 0 10px; } .stars button { font-size: 26px; background: none; border: 0; color: #d6d9dd; cursor: pointer; transition: transform .15s, color .15s; }
  .stars button.on { color: #f5b301; }
  .card textarea { width: 100%; font: inherit; padding: 10px 12px; border-radius: 12px; border: 1.5px solid #e3e5e8; resize: none; outline: none; margin-bottom: 8px; }
  .card .send2 { font: inherit; font-weight: 700; color: #fff; background: var(--brand); border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer; }
  .card .code.rem { display: flex; gap: 8px; margin: 10px 0 4px; } .card .code.rem input { flex: 1; min-width: 0; font: inherit; padding: 11px 13px; border-radius: 12px; border: 1.5px solid #e3e5e8; outline: none; } .card .code.rem input:focus { border-color: var(--brand); }
  .card .code.rem .go { width: 46px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; cursor: pointer; }
  .fine { font-size: 11.5px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
  .msg .doc { border: 0; font: inherit; font-weight: 700; cursor: pointer; }
  /* cart: browse the menu, fill a cart, hand it to the AI — it asks size/milk/extras next */
  .cartbar { display: flex; align-items: center; gap: 10px; margin: 0 14px 8px; padding: 10px 12px 10px 14px; border-radius: 16px; background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; animation: in .3s var(--ease) both; }
  .cartbar .ic { position: relative; font-size: 17px; } .cartbar .ic b { position: absolute; top: -8px; right: -10px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--brand); font-size: 11px; display: grid; place-items: center; }
  .cartbar .ic.bump { animation: bump .45s var(--ease); }
  @keyframes bump { 30% { transform: scale(1.35) rotate(-8deg); } 60% { transform: scale(.9); } }
  .cartbar .sum { flex: 1; min-width: 0; } .cartbar .sum small { display: block; font-weight: 500; opacity: .7; font-size: 12px; }
  .cartbar button { font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 9px 12px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
  .cartbar .view { background: rgba(255,255,255,.12); color: #fff; } .cartbar .go { background: var(--brand); color: #fff; }
  .sheet .cartbar { margin: 8px 18px 16px; }
  .mi .qty, .cl .qty { display: inline-flex; align-items: center; gap: 2px; background: var(--brand-soft); border-radius: 10px; padding: 2px; }
  .qty button { width: 28px; height: 28px; border: 0; border-radius: 8px; background: #fff; color: var(--brand); font-size: 12px; cursor: pointer; }
  .qty span { min-width: 20px; text-align: center; font-weight: 800; font-size: 14px; }
  .mi:has(.qty) { grid-template-columns: 54px 1fr auto auto; }
  .clist { overflow-y: auto; padding: 0 18px; display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto !important; min-height: 0; }
  .cl { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 8px; border-radius: 14px; border: 1px solid #eef0f2; animation: in .25s both; }
  .cl .ph { width: 46px; height: 46px; border-radius: 12px; background: var(--brand-soft) center/cover no-repeat; display: grid; place-items: center; color: var(--brand); }
  .cl b { font-size: 14px; } .cl small { display: block; color: var(--muted); font-size: 12.5px; }
  .ctot { display: flex; justify-content: space-between; padding: 12px 18px 0; font-weight: 800; } .ctot span:last-child { color: var(--brand); }
  .cnote { padding: 6px 18px 0; color: var(--muted); font-size: 12.5px; display: flex; gap: 6px; align-items: center; } .cnote i { color: var(--brand); }
  .cacts { display: flex; gap: 8px; padding: 12px 18px 18px; }
  .cacts button { flex: 1; font: inherit; font-weight: 800; border-radius: 14px; padding: 13px; cursor: pointer; display: inline-flex; justify-content: center; gap: 8px; align-items: center; }
  .cacts .more { background: #fff; border: 1.5px solid #e3e5e8; color: var(--ink); } .cacts .go { background: var(--brand); color: #fff; border: 0; flex: 1.4; }
  .docframe { flex: 1 1 auto !important; min-height: 60dvh; border: 0; margin: 0 12px 12px; border-radius: 12px; background: #f1f2f4; }
  .fly { position: fixed; z-index: 60; width: 34px; height: 34px; border-radius: 50%; background: var(--brand) center/cover; pointer-events: none; transition: transform .6s cubic-bezier(.5,-.3,.7,1), opacity .6s; }
  .mi .ph.photo, .cl .ph.photo { background-size: cover; }
  .mi .ph.char, .cl .ph.char { background-color: var(--tint); background-size: 88%; background-position: center 70%; }
  .mi .ph { cursor: pointer; }
  .mi .add { position: relative; } .mi .add em { position: absolute; top: -7px; right: -7px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--ink); color: #fff; font: 700 11px/18px inherit; font-style: normal; }
  .cl small.lp { color: var(--ink); font-weight: 700; }
  .ix { position: absolute; right: 14px; top: 12px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); box-shadow: 0 2px 8px rgba(0,0,0,.12); font-size: 16px; cursor: pointer; }
  .ibody { overflow-y: auto; flex: 1 1 auto !important; min-height: 0; padding: 0 18px 8px; }
  .ihero { height: 190px; border-radius: 18px; margin: 4px 0 12px; background: var(--brand-soft) center/cover no-repeat; }
  .ihero.char { background-color: var(--tint); background-size: contain; background-position: center bottom; }
  .ihead h4 { margin: 0; font-size: 20px; } .ihead p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .ogrp { margin-top: 16px; } .olab { font-weight: 800; font-size: 14.5px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .olab span { font-weight: 600; font-size: 11.5px; color: var(--muted); background: #f1f2f4; border-radius: 999px; padding: 2px 8px; } .olab .req { color: #a35a00; background: #fff3e0; }
  .ochips { display: flex; flex-wrap: wrap; gap: 8px; }
  .oc { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 14px; font-weight: 600; padding: 9px 13px; border-radius: 12px; border: 1.5px solid #e3e5e8; background: #fff; cursor: pointer; transition: border-color .15s, background .15s; }
  .oc small { color: var(--muted); font-weight: 600; } .oc.on { border-color: var(--brand); background: var(--brand-soft); color: #1f7a16; } .oc.on i { color: var(--brand); }
  .ogrp textarea { width: 100%; font: inherit; font-size: 14px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid #e3e5e8; resize: none; outline: none; } .ogrp textarea:focus { border-color: var(--brand); }
  .ifoot { display: flex; gap: 10px; align-items: center; padding: 12px 18px 18px; border-top: 1px solid #f0f1f3; }
  .qty.big button { width: 36px; height: 36px; } .qty.big span { min-width: 26px; font-size: 16px; }
  .iadd { flex: 1; font: inherit; font-weight: 800; font-size: 15.5px; color: #fff; background: var(--brand); border: 0; border-radius: 14px; padding: 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
  .iadd:disabled { background: #c9ccd1; cursor: default; }
  .moods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .moods button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 14px; border: 1.5px solid #eceef0; background: #fff; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: border-color .15s, transform .15s; }
  .moods button i { font-size: 20px; color: var(--brand); }
  .moods button.on { border-color: var(--brand); background: var(--brand-soft); } .moods button:disabled:not(.on) { opacity: .45; }
  .card.usual p b { color: var(--ink); } .card.usual .wa { background: var(--brand); border: 0; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  /* ---- header extras, busy strip ---- */
  .hbtn.sm { width: 34px; height: 34px; font: 800 12px/1 inherit; }
  #busy:empty { display: none; }
  .busy { display: flex; align-items: center; gap: 8px; margin: 8px 14px 0; padding: 7px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; background: #f3f8f2; color: #2b5e25; }
  .busy.steady { background: #fff8e6; color: #8a5a00; } .busy.busy { background: #fff0ec; color: #a1361c; }
  .busy i { font-size: 12px; }

  .mfilters, .avoid { display: flex; gap: 6px; overflow-x: auto; padding: 0 18px 10px; scrollbar-width: none; } .mfilters::-webkit-scrollbar, .avoid::-webkit-scrollbar { display: none; }

(() => {

      .replace(/(^|\s)_([^_\n]+)_/g, "$1<i>$2</i>")

  async function ensureMenu() {

      $("mlist").innerHTML = '<div class="sys"><i class="fa-solid fa-circle-notch fa-spin"></i>Loading the menu</div>';
      const u = new URL(api("/api/widget/menu")); u.searchParams.set("slug", slug); u.searchParams.set("token", token);
      MENU = await fetch(u).then((x) => x.json()).catch(() => null);
      if (!MENU?.categories) { MENU = null; $("mlist").innerHTML = '<div class="sys">Menu unavailable — ask in the chat.</div>'; return; }
      $("mtabs").innerHTML = MENU.categories.map((c, i) => `<button data-c="${esc(c.name)}" class="${i ? "" : "on"}">${esc(c.name)}</button>`).join("");
      $("mtabs").querySelectorAll("button").forEach((b) => b.onclick = () => { $("mq").value = ""; mcat = b.dataset.c; $("mtabs").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); drawMenu(); });
      mcat = orderedCats()[0]?.name;
    }
  }
  function drawMenu() {
    const q = $("mq").value.trim().toLowerCase();
    const all = MENU.categories.flatMap((c) => c.items);
    let list;
    if (q) list = all.filter((i) => `${i.name} ${i.description}`.toLowerCase().includes(q));
    else if (mfilter) list = all.filter(FILTERS[mfilter].test);
    else if (mcat === "__fav") list = all.filter((i) => favs.includes(i.name));
    else if (mcat === "__pop") list = popular.map((p) => all.find((i) => i.name === p.name)).filter(Boolean);
    else list = (MENU.categories.find((c) => c.name === mcat) || MENU.categories[0]).items;
    $("mlist").innerHTML = list.map((i, k) => {
      const w = warnFor(i), pc = popCount(i.name);
      return `<div class="mi ${i.unavailable ? "off" : ""}" style="animation-delay:${Math.min(k, 10) * 30}ms">
      ${phHTML(i)}
      <div><div class="nm"><b>${esc(i.name)}</b>${heartBtn(i.name)}</div>${i.bestseller ? `<span class="badge best"><i class="fa-solid fa-star"></i>${T("popular")}</span>` : ""}${i.unavailable ? `<span class="badge">${i.unavailable === "sold_out" ? T("soldOut") : T("notNow")}</span>` : ""}<small>${esc(i.description || "")}</small>${pc ? `<span class="hot"><i class="fa-solid fa-fire"></i>${T("nToday").replace("{n}", pc)}</span>` : ""}${w.map((x) => `<span class="warn"><i class="fa-solid fa-triangle-exclamation"></i>${esc(T(x))}</span>`).join("")}</div>
      <div class="pr">${i.price}${i.price_l ? ` / ${i.price_l}` : ""}<span>${esc(MENU.currency)}${i.price_l ? " · M / L" : ""}</span></div>${i.options?.length ? `<button class="add" data-pick="${esc(i.name)}" aria-label="${esc(i.name)}"><i class="fa-solid fa-plus"></i>${cartQty(i.name) ? `<em>${cartQty(i.name)}</em>` : ""}</button>` : cartQty(i.name) ? `<span class="qty"><button data-dec="${esc(i.name)}" aria-label="-"><i class="fa-solid fa-minus"></i></button><span>${cartQty(i.name)}</span><button data-inc="${esc(i.name)}" aria-label="+"><i class="fa-solid fa-plus"></i></button></span>` : `<button class="add" data-inc="${esc(i.name)}" aria-label="${esc(i.name)}"><i class="fa-solid fa-plus"></i></button>`}</div>`;
    }).join("") || `<div class="sys">${T("nothing")}</div>`;
    wireQty($("mlist"));
    $("mlist").querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => openItem(b.dataset.pick));
    $("mlist").querySelectorAll(".mi").forEach((row) => { const b = row.querySelector("[data-pick],[data-inc]"); row.querySelector(".ph").onclick = () => b && openItem(b.dataset.pick || b.dataset.inc); });
    wireHearts($("mlist"));
  }
  $("mq").addEventListener("input", drawMenu);

  // ---------- art: the café's own photos, else its characters (Koffee Kulture), else an icon ----------
  const ART = slug === "koffee-kulture" ? ["char-chair", "char-sip", "char-dance", "char-hug", "char-walk", "char-guitar", "char-kroissant", "char-travel"].map((n) => `https://munadim.com/koffee/${n}.png`) : null;
  const TINT = ["#FFE1EF", "#DDF3D8", "#FFF0C2", "#FFE6D6", "#E6EEFF", "#F1E6FF"];
  const hash = (t) => [...t].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const artOf = (i) => i?.photo ? { src: i.photo, photo: true } : ART ? { src: ART[hash(i?.category || i?.name || "") % ART.length], photo: false } : null;
  const tintOf = (i) => TINT[hash(i?.name || "") % TINT.length];
  function phHTML(i, cls = "ph") {
    const a = artOf(i);
    if (!a) return `<div class="${cls}"><i class="fa-solid fa-mug-hot"></i></div>`;
    return `<div class="${cls} ${a.photo ? "photo" : "char"}" style="background-image:url('${esc(a.src)}');--tint:${tintOf(i)}"></div>`;
  }

  // ---------- item sheet: size / milk / extras / side + comments, live price ----------
  let picking = null;
  function linePrice(it, picks) {
    let p = Number(it.price) || 0;
    for (const g of it.options || []) for (const c of g.choices) if ((picks[g.key] || []).includes(c.name)) { if (c.price != null) p = c.price; else if (c.delta) p += c.delta; }
    return p;
  }
  function openItem(name, fromSite) {
    const it = findItem(name); if (!it) return;
    if (it.unavailable) return sys("fa-clock", `${it.name} isn't available right now.`);
    picking = { it, picks: {}, qty: 1 };
    for (const g of it.options || []) if (g.required && g.key === "size") picking.picks[g.key] = [g.choices[0].name];
    const dm = profile?.default_milk; const mg = (it.options || []).find((g) => g.key === "milk");
    if (dm && mg) { const c = mg.choices.find((c) => c.name.toLowerCase().startsWith(dm.toLowerCase().replace(/ milk$/, ""))); if (c) picking.picks.milk = [c.name]; }
    drawItem(); openSheet($("itemSheet"));
    if (fromSite) toParent({ type: "kk:open" });
  }
  function drawItem() {
    const { it, picks, qty } = picking;
    const missing = (it.options || []).filter((g) => g.required && !(picks[g.key] || []).length);
    $("ibody").innerHTML = `${phHTML(it, "ihero")}<div class="ihead"><div><h4>${esc(it.name)}</h4>${it.description ? `<p>${esc(it.description)}</p>` : ""}${popCount(it.name) ? `<p style="color:#a1361c;font-weight:700"><i class="fa-solid fa-fire"></i> ${T("orderedToday").replace("{n}", popCount(it.name))}</p>` : ""}</div>${heartBtn(it.name)}</div>${warnFor(it).map((w) => `<div class="warnline"><i class="fa-solid fa-triangle-exclamation"></i>${esc(T("mentions"))} ${esc(T(w))} — ${esc(T("confirmStaff"))}</div>`).join("")}
      ${(it.options || []).map((g) => `<div class="ogrp"><div class="olab">${esc(g.label)}${g.required ? `<span class="req">${T("required")}</span>` : g.multi ? `<span>${T("pickAny")}</span>` : `<span>${T("optional")}</span>`}</div><div class="ochips">${g.choices.map((c) => {
        const on = (picks[g.key] || []).includes(c.name);
        const extra = c.price != null ? `${c.price}` : c.delta ? `+${c.delta}` : "";
        return `<button class="oc ${on ? "on" : ""}" data-g="${esc(g.key)}" data-c="${esc(c.name)}">${on ? '<i class="fa-solid fa-check"></i>' : ""}${esc(c.name)}${extra ? `<small>${extra}</small>` : ""}</button>`; }).join("")}</div></div>`).join("")}
      <div class="ogrp"><div class="olab">${T("comments")}<span>${T("optional")}</span></div><textarea id="inote" rows="2" maxlength="120" placeholder="${esc(T("notePh"))}">${esc(picking.note || "")}</textarea></div>${pairsHTML(it)}`;
    wireItemExtras(it);
    $("ibody").querySelectorAll(".oc").forEach((b) => b.onclick = () => {
      const g = it.options.find((x) => x.key === b.dataset.g); const cur = picks[g.key] || [];
      picks[g.key] = g.multi ? (cur.includes(b.dataset.c) ? cur.filter((x) => x !== b.dataset.c) : [...cur, b.dataset.c]) : (cur[0] === b.dataset.c && !g.required ? [] : [b.dataset.c]);
      picking.note = $("inote").value; drawItem();
    });
    $("iqty").textContent = qty;
    $("iadd").disabled = missing.length > 0;
    $("iadd").innerHTML = missing.length ? esc(T("choose").replace("{x}", missing[0].label.toLowerCase())) : `<i class="fa-solid fa-basket-shopping"></i>${T("addBtn")} · ${linePrice(it, picks) * qty} ${esc(MENU.currency)}`;
  }
  $("iminus").onclick = () => { picking.note = $("inote").value; picking.qty = Math.max(1, picking.qty - 1); drawItem(); };
  $("iplus").onclick = () => { picking.note = $("inote").value; picking.qty = Math.min(9, picking.qty + 1); drawItem(); };
  $("iadd").onclick = () => {
    const { it, picks, qty } = picking; const note = $("inote").value.trim().slice(0, 120) || null;
    addLine(it, picks, qty, note, $("iadd")); closeSheets();
    if ($("menuSheet").dataset.back) { delete $("menuSheet").dataset.back; openMenu(); }
  };

  // ---------- mood + usual: get the guest talking to the AI ----------
  // every mood is a QUESTION — "Surprise me! Pick something" read as an order and put a latte on the bill
  const MOOD_KEYS = ["sleepy", "sweet", "hot", "hungry", "matcha", "surprise"];
  const MOODS = [["fa-bed", "mSleepy", "sleepyMsg"], ["fa-cookie-bite", "mSweet", "sweetMsg"], ["fa-snowflake", "mHot", "hotMsg"], ["fa-utensils", "mHungry", "hungryMsg"], ["fa-leaf", "mMatcha", "matchaMsg"], ["fa-wand-magic-sparkles", "mSurprise", "surpriseMsg"]];
  function moodCard(known, again) {
    if (!again && document.querySelector(".mood")) return;
    const row = document.createElement("div"); row.className = "card mood";
    const lm = profile?.last_mood, lmItem = lm?.item && findItem(lm.item);
    const recall = lm && lmItem && Date.now() - new Date(lm.at).getTime() > 3 * 3600_000;
    row.innerHTML = `<h4><i class="fa-solid fa-face-smile"></i>${T(known || recall ? "moodKnown" : "moodFirst")}</h4><p>${recall ? esc(T("lastMood").replace("{mood}", T("was_" + lm.mood)).replace("{item}", lm.item)) : T("moodBody")}</p>${recall ? `<div class="acts" style="margin:4px 0 10px"><button class="wa" data-again style="background:var(--brand);border:0;font:inherit;font-weight:700;cursor:pointer"><i class="fa-solid fa-rotate-left"></i>${esc(T("againItem").replace("{item}", lm.item))}</button></div>` : ""}<div class="moods">${MOODS.map(([ic, l], k) => `<button data-m="${k}"><i class="fa-solid ${ic}"></i>${T(l)}</button>`).join("")}</div>`;
    log.appendChild(row); log.scrollTop = log.scrollHeight;
    const ag = row.querySelector("[data-again]");
    if (ag) ag.onclick = () => { if (lmItem.options?.length) openItem(lmItem.name); else { addLine(lmItem, {}, 1, null); drawCartSheet(); openSheet($("cartSheet")); } };
    row.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => {
      row.querySelectorAll("button").forEach((x) => x.disabled = true); b.classList.add("on");
      // today's mood is remembered as history (with what they order next), never as a preference
      fetch(api("/api/widget/profile"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, last_mood: MOOD_KEYS[+b.dataset.m] }) }).catch(() => {});
      input.value = T(MOODS[+b.dataset.m][2]); sendMsg();
    });
  }
  const usualText = (u) => u.map((l) => `${l.qty > 1 ? l.qty + "× " : ""}${l.name}${l.options?.length ? ` (${l.options.join(", ")})` : ""}`).join(" + ");
  function usualCard(u) {
    const row = document.createElement("div"); row.className = "card usual";
    row.innerHTML = `<h4><i class="fa-solid fa-rotate-left"></i>${T("usualQ")}</h4><p><b>${esc(usualText(u))}</b></p>
      <div class="acts"><button class="wa" data-yes><i class="fa-solid fa-check"></i>${T("sameAgain")}</button><button class="skip" data-new>${T("somethingNew")}</button></div>`;
    log.appendChild(row); log.scrollTop = log.scrollHeight;
    row.querySelector("[data-yes]").onclick = () => { repeatUsual(u); row.querySelector(".acts").innerHTML = `<p class="fine"><i class="fa-solid fa-basket-shopping"></i> ${T("inCart")}</p>`; };
    row.querySelector("[data-new]").onclick = () => { row.remove(); moodCard(true); };
  }
  async function repeatUsual(u) {
    await ensureMenu();
    for (const l of u) {
      const it = findItem(l.name); if (!it || it.unavailable) continue;
      const picks = {}; for (const g of it.options || []) { const hit = g.choices.filter((c) => (l.options || []).includes(c.name)).map((c) => c.name); if (hit.length) picks[g.key] = hit; }
      addLine(it, picks, l.qty, l.note);
    }
    if (cart.length) { drawCartSheet(); openSheet($("cartSheet")); }
  }

  // ---------- cart ----------
  let cart = [];
  const cartKey = () => `kk:cart:${session?.sessionId || token}`;
  const findItem = (n) => MENU?.categories.flatMap((c) => c.items).find((i) => i.name === n);
  const cartQty = (n) => cart.filter((l) => l.name === n).reduce((a, l) => a + l.qty, 0);
  const cartCount = () => cart.reduce((a, l) => a + l.qty, 0);
  const cartTotal = () => cart.reduce((a, l) => a + l.qty * (Number(l.price) || 0), 0);
  function saveCart() { LS.set(cartKey(), cart); if (!adopting) pushCart(); }
  const lineKey = (name, opts, note) => `${name}|${(opts || []).join(",")}|${note || ""}`;
  function addLine(it, picks, qty, note, from) {
    const opts = (it.options || []).flatMap((g) => (picks[g.key] || []).map((c) => (g.key === "milk" && !/milk/i.test(c) ? `${c} milk` : c)));
    const size = (it.options || []).find((g) => g.key === "size") ? (picks.size || [])[0] || null : null;
    const key = lineKey(it.name, opts, note); let l = cart.find((x) => x.key === key);
    if (!l) { l = { key, name: it.name, qty: 0, price: linePrice(it, picks), opts, size, note: note || null, photo: it.photo || null, by: me }; cart.push(l); }
    l.qty += qty; saveCart(); drawCart(true); buzz(10);
    if (from) flyFrom(from, it.photo);
    if ($("menuSheet").classList.contains("open")) drawMenu();
    if ($("cartSheet").classList.contains("open")) drawCartSheet();
  }
  // plain items (no options) keep the quick − / + stepper; lines with options step by their key
  function changeQty(ref, d, from) {
    let l = cart.find((x) => x.key === ref) || [...cart].reverse().find((x) => x.name === ref && !x.opts?.length && !x.note);
    if (!l && d > 0) { const it = findItem(ref); if (!it) return; if (it.options?.length) return openItem(ref); return addLine(it, {}, 1, null, from); }
    if (!l) return;
    l.qty += d; if (l.qty <= 0) cart = cart.filter((x) => x !== l);
    saveCart(); drawCart(d > 0);
    if (d > 0 && from) flyFrom(from, l.photo);
    if ($("menuSheet").classList.contains("open")) drawMenu();
    if ($("cartSheet").classList.contains("open")) drawCartSheet();
  }
  function wireQty(root) {
    root.querySelectorAll("[data-inc]").forEach((b) => b.onclick = () => changeQty(b.dataset.inc, 1, b));
    root.querySelectorAll("[data-dec]").forEach((b) => b.onclick = () => changeQty(b.dataset.dec, -1));
  }
  function flyFrom(el, photo) {
    const a = el.getBoundingClientRect(); const target = document.querySelector("#mcart .ic, #cartHost .ic"); if (!target) return;
    const b = target.getBoundingClientRect(); const f = document.createElement("div"); f.className = "fly";
    if (photo) f.style.backgroundImage = `url('${photo}')`;
    f.style.left = a.left + "px"; f.style.top = a.top + "px"; document.body.appendChild(f);
    requestAnimationFrame(() => { f.style.transform = `translate(${b.left - a.left}px, ${b.top - a.top}px) scale(.4)`; f.style.opacity = ".2"; });
    setTimeout(() => f.remove(), 650);
  }
  const barHTML = (inSheet) => `<div class="cartbar"><span class="ic"><i class="fa-solid fa-basket-shopping"></i><b>${cartCount()}</b></span>
    <span class="sum">${cartTotal()} ${esc(MENU?.currency || "EGP")}<small>${T(cartCount() > 1 ? "cartNs" : "cartN").replace("{n}", cartCount())}</small></span>
    <button class="view" data-view><i class="fa-solid fa-list"></i>${inSheet ? T("cartBtn") : T("review")}</button><button class="go" data-go><i class="fa-solid fa-paper-plane"></i>${T("order")}</button></div>`;
  // embedded on the café's own site: the page's "+" buttons fill this cart, and the page shows the count
  function toParent(msg) { try { if (parent !== window) parent.postMessage(msg, "*"); } catch {} }
  function drawCart(bump) {
    toParent({ type: "kk:cart", count: cartCount(), total: cartTotal(), currency: MENU?.currency || "EGP" });

  function drawCartSheet() {

      <span class="qty"><button data-dec="${esc(l.key || l.name)}" aria-label="One less"><i class="fa-solid fa-minus"></i></button><span>${l.qty}</span><button data-inc="${esc(l.key || l.name)}" aria-label="One more"><i class="fa-solid fa-plus"></i></button></span></div>`).join("");

  }
  // the cart becomes one message — the order agent takes it from there (options, add-ons, confirm)
  function sendCart() {
    if (!cart.length || !session) return;
    // said the way a guest would: "1 Large Iced Spanish Latte with Oat milk, Extra shot (less ice)"
    const words = cart.map((l) => { const rest = (l.opts || []).filter((o) => o !== l.size);
      return `${l.qty} ${l.size ? l.size + " " : ""}${l.name}${rest.length ? ` with ${rest.join(", ")}` : ""}${l.note ? ` (${l.note})` : ""}`; });
    input.value = `I'd like ${words.length > 1 ? words.slice(0, -1).join(", ") + " and " + words.at(-1) : words[0]}`;
    cart = []; saveCart(); drawCart(); closeSheets(); sendMsg();
  }
  $("cmore").onclick = openMenu; $("cgo").onclick = sendCart;
  async function loadCart() {
    cart = (LS.get(cartKey()) || []).map((l) => ({ ...l, key: l.key || lineKey(l.name, l.opts, l.note) }));

  }
  addEventListener("message", async (e) => {
    if (e.data?.type === "kk:prefill" && e.data.text) { input.value = e.data.text; input.focus(); }

      else if (it) changeQty(e.data.name, 1);

    }
    if (e.data?.type === "kk:cart-open" && session && cart.length) { drawCartSheet(); openSheet($("cartSheet")); }
  });

  const isDrink = (i) => DRINK.test(i?.category || "");
  function pairsFor(items, n = 2) {
    const all = MENU.categories.flatMap((c) => c.items).filter((i) => !i.unavailable);
    const have = new Set(items.map((i) => i.name));
    const wantDrink = !items.some(isDrink), wantFood = !items.some((i) => !isDrink(i));
    const pool = all.filter((i) => !have.has(i.name) && (wantDrink ? isDrink(i) : wantFood ? !isDrink(i) : !isDrink(i)) && !/water|beans/i.test(i.name));
    const score = (i) => popCount(i.name) * 3 + (i.bestseller ? 2 : 0) + (i.photo ? 1 : 0) + (/sweet|bakery/i.test(i.category) && !wantDrink ? 1 : 0);
    return pool.filter((i) => score(i) > 0).sort((a, b) => score(b) - score(a)).slice(0, n);
  }
  const pairCard = (p) => { const a = artOf(p); return `<button class="pair" data-pair="${esc(p.name)}">${a ? `<span class="ph ${a.photo ? "" : "char"}" style="background-image:url('${esc(a.src)}');--tint:${tintOf(p)}"></span>` : ""}<span><b>${esc(p.name)}</b><small>+${p.price} ${esc(MENU.currency)}</small></span></button>`; };
  function pairsHTML(it) { const ps = pairsFor([it]); return ps.length ? `<div class="ogrp"><div class="olab">${T("goesWith")}</div><div class="pairs">${ps.map(pairCard).join("")}</div></div>` : ""; }
  function addPair(name) { const p = findItem(name); if (!p) return; if (p.options?.length) { closeSheets(); setTimeout(() => openItem(name), 250); } else { addLine(p, {}, 1, null); popChar("sip", "+ " + p.name); } }
  function wireItemExtras(it) {
    $("ibody").querySelectorAll("[data-pair]").forEach((b) => b.onclick = () => { const cur = picking; addPair(b.dataset.pair); picking = cur; b.style.opacity = .45; b.disabled = true; });
    wireHearts($("ibody"));
    const hero = $("ibody").querySelector(".ihero.photo"); if (hero) hero.onclick = () => { $("zoomimg").src = it.photo; $("zoom").hidden = false; };
  }
  $("zoom").onclick = () => { $("zoom").hidden = true; };
  function cartPairing() {
    $("cartSheet").querySelector(".cartpair")?.remove();
    const items = cart.map((l) => findItem(l.name)).filter(Boolean); if (!items.length) return;
    const ps = pairsFor(items, 1); if (!ps.length) return;
    const d = document.createElement("div"); d.className = "pairs cartpair"; d.innerHTML = `<div class="olab">${T("goesOrder")}</div>${pairCard(ps[0])}`;
    $("clist").after(d); d.querySelector("[data-pair]").onclick = () => addPair(ps[0].name);
  }

  // ---------- code-picked quick replies under an AI message that came with none ----------
  function codeChips(text) {
    if (!MENU || !text) return;
    const all = MENU.categories.flatMap((c) => c.items);
    const low = text.toLowerCase();
    const hit = all.filter((i) => low.includes(i.name.toLowerCase())).sort((a, b) => b.name.length - a.name.length)[0];
    if (/O-[A-Z0-9]{4}|YOUR ORDER|pay\?|ادفع/i.test(text)) return;
    const chipsList = hit ? [[T("addIt").replace("{item}", hit.name), () => { if (hit.options?.length) openItem(hit.name); else addLine(hit, {}, 1, null); }],
      ...(hit.price_l ? [[T("makeLarge"), () => openItem(hit.name)]] : []), [T("somethingElse"), T("elseMsg")]]
      : [[T("whatsPopular"), T("whatPopularMsg")], [T("menu"), () => openMenu()]];
    chips.innerHTML = "";
    chipsList.slice(0, 3).forEach(([label, act], i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.style.animationDelay = `${i * 60}ms`;
      b.innerHTML = `<i class="fa-solid ${typeof act === "function" ? "fa-plus" : "fa-angle-right"}"></i>${esc(label)}`;
      b.onclick = () => { chips.innerHTML = ""; if (typeof act === "function") act(); else { input.value = act; sendMsg(); } };
      chips.appendChild(b);
    });
  }

  // ---------- feel: haptics, chime, character reactions, ready flash ----------
  const buzz = (ms) => { try { navigator.vibrate?.(ms); } catch {} };
  let actx = null;
  addEventListener("pointerdown", () => { try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); } catch {} }, { once: false, passive: true });
  function chime() {
    try { if (!actx) return; const t = actx.currentTime;
      [[880, 0], [1320, .16], [1760, .32]].forEach(([f, d]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.25, t + d + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + .5); o.connect(g).connect(actx.destination); o.start(t + d); o.stop(t + d + .55); });
    } catch {}
  }
  let popT;
  function popChar(n, text) {
    if (!KK) { if (text) sys("fa-face-smile", text); return; }
    $("charimg").src = CH(n); $("charbub").textContent = text || ""; $("charbub").hidden = !text;
    $("charpop").classList.add("show"); clearTimeout(popT); popT = setTimeout(() => $("charpop").classList.remove("show"), 2800);
  }
  let titleT;
  function readyAlert(o) {
    chime(); buzz([200, 100, 200, 100, 300]);
    $("flash").classList.remove("on"); void $("flash").offsetWidth; $("flash").classList.add("on");
    popChar("sip", T("itsReady"));
    const base = document.title; let k = 0; clearInterval(titleT);
    titleT = setInterval(() => { document.title = k++ % 2 ? base : `● ${T("ready")}! — ${o.code}`; if (k > 12) { clearInterval(titleT); document.title = base; } }, 900);
  }

  // ---------- order stages: placed → ready → served ----------
  const thumbKey = () => `kk:thumbed:${session?.sessionId || token}`;
  const thumbed = { has: (c) => (LS.get(thumbKey()) || []).includes(c), add: (c) => LS.set(thumbKey(), [...(LS.get(thumbKey()) || []), c].slice(-20)) };
  function onStage(o, stage, prev) {
    if (prev === null) { if (stage === 0 && booted) popChar("dance", T("orderIn")); return; }
    if (stage === 2 && prev < 2) readyAlert(o);
    if (stage === 3 && prev < 3) { popChar("walk", T("enjoy")); if (!(prev < 2)) {} drinkThumbs(o); }
  }
  function drinkThumbs(o) {
    if (thumbed.has(o.code)) return; thumbed.add(o.code);
    const names = (o.items || []).map((s) => s.replace(/^\d+×\s*/, "")).slice(0, 5);
    if (!names.length) return;
    const row = document.createElement("div"); row.className = "card";
    row.innerHTML = `<h4><i class="fa-solid fa-thumbs-up"></i>${T("rateDrinks")}</h4><div class="thumbs">${names.map((n) => `<div><span>${esc(n)}</span><span><button data-up="1" data-n="${esc(n)}">👍</button> <button data-up="0" data-n="${esc(n)}">👎</button></span></div>`).join("")}</div>`;
    log.appendChild(row); log.scrollTop = log.scrollHeight;
    row.querySelectorAll("[data-n]").forEach((b) => b.onclick = () => {
      b.parentElement.querySelectorAll("button").forEach((x) => { x.classList.remove("on"); x.disabled = true; }); b.classList.add("on"); buzz(8);
      fetch(api("/api/widget/rate-item"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, item: b.dataset.n, up: b.dataset.up === "1", order_code: o.code }) }).catch(() => {});
    });
  }
  async function anotherRound(o) {
    await ensureMenu();
    const lines = (o.items || []).map((s) => { const m = /^(\d+)×\s*(.+)$/.exec(s); return m ? { qty: +m[1], name: m[2] } : null; }).filter(Boolean);
    const drinks = lines.filter((l) => isDrink(findItem(l.name)));
    for (const l of (drinks.length ? drinks : lines)) { const it = findItem(l.name); if (it && !it.unavailable) addLine(it, {}, l.qty, null); }
    if (cart.length) { drawCartSheet(); openSheet($("cartSheet")); }
  }

  // ---------- every poll: busy strip, popular today, the shared cart, the tab ----------
  let lastTable = null, cartRev = 0, adopting = false, lastLocalEdit = 0, pushT;
  function onPoll(j) {
    if (j.busy) {
      const b = j.busy, lbl = b.level === "quick" ? T("quick") : b.level === "steady" ? T("steady") : T("busyNow");
      $("busy").innerHTML = `<div class="busy ${b.level === "quick" ? "" : b.level}"><i class="fa-solid ${b.level === "quick" ? "fa-bolt" : b.level === "steady" ? "fa-clock" : "fa-fire"}"></i>${esc(lbl)} · ${esc(T("about").replace("{m}", b.minutes))}</div>`;
    }

    if (j.table) { lastTable = j.table; me = j.table.me || me; adoptCart(j.table.cart); if ($("tabSheet").classList.contains("open")) drawTab(); }
  }
  function pushCart() {
    lastLocalEdit = Date.now(); clearTimeout(pushT);
    pushT = setTimeout(async () => {
      if (!session) return;
      const r = await fetch(api("/api/widget/cart"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, lines: cart }) }).then((x) => x.json()).catch(() => null);
      if (r?.cart?.rev) cartRev = r.cart.rev;
    }, 250);
  }
  function adoptCart(tc) {
    if (!tc || !(tc.rev > cartRev) || Date.now() - lastLocalEdit < 1500) return;
    const mine = new Map(cart.map((l) => [l.key, l.qty]));
    if (cartRev) for (const l of tc.lines || []) if (l.by && l.by !== me && !(mine.get(l.key) >= l.qty)) sys("fa-user-plus", T("addedBy").replace("{who}", l.by).replace("{item}", l.name));
    cartRev = tc.rev; adopting = true; cart = (tc.lines || []).map((l) => ({ ...l })); saveCart(); adopting = false; drawCart();
    if ($("menuSheet").classList.contains("open")) drawMenu();
    if ($("cartSheet").classList.contains("open")) drawCartSheet();
  }

  // ---------- the tab: every order at the table, tips, your share, split ----------
  quick.querySelector("[data-tab]").addEventListener("click", () => { drawTab(); openSheet($("tabSheet")); });
  function drawTab() {
    const t = lastTable?.tab; const cur = MENU?.currency || "EGP";
    if (!t || (!t.orders.length && !t.tips.length)) { $("tbody").innerHTML = `<p class="sys" style="padding:20px 0">${esc(T("tabEmpty"))}</p><div class="tacts"><button data-tipgo><i class="fa-solid fa-hand-holding-heart"></i>${esc(T("addTip"))}</button><button class="go" data-bill><i class="fa-solid fa-receipt"></i>${esc(T("requestBill"))}</button></div>`; wireTab(); return; }
    $("tbody").innerHTML = t.orders.map((o) => `<div class="trow ${o.mine ? "me" : ""}"><span><b>${esc(o.by)}</b> · ${esc(o.code)}<small>${esc(o.items.join(" · "))}</small></span><b>${o.total} ${esc(cur)}</b></div>`).join("")
      + t.tips.map((x) => `<div class="trow ${x.mine ? "me" : ""}"><span><b>${esc(x.by)}</b> · ${esc(T("tipLine"))}<small>${esc(x.target)}</small></span><b>${x.amount} ${esc(cur)}</b></div>`).join("")
      + `<div class="tsum"><div class="big"><span>${esc(T("tableTotal"))}</span><span>${t.total} ${esc(cur)}</span></div><div><span>${esc(T("yourShare"))}</span><span>${t.mine} ${esc(cur)}</span></div>${t.phones > 1 ? `<div><span>${esc(T("splitEven").replace("{n}", t.phones))}</span><span>${Math.ceil(t.total / t.phones)} ${esc(cur)}</span></div>` : ""}</div>`
      + `<div class="tacts"><button data-tipgo><i class="fa-solid fa-hand-holding-heart"></i>${esc(T("addTip"))}</button><button class="go" data-bill><i class="fa-solid fa-receipt"></i>${esc(T("requestBill"))}</button></div><p class="fine" style="text-align:center"><i class="fa-solid fa-circle-info"></i> ${esc(T("payNote"))}</p>`;
    wireTab();
  }
  function wireTab() {
    $("tbody").querySelector("[data-tipgo]").onclick = () => { drawTip(); openSheet($("tipSheet")); };
    $("tbody").querySelector("[data-bill]").onclick = async () => {
      closeSheets();
      const r = await fetch(api("/api/widget/call-staff"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, reason: "bill" }) }).then((x) => x.json()).catch(() => null);
      sys("fa-receipt", r?.ok ? T("billCalled") : "Couldn't reach the counter — try again.");
    };
  }

  // ---------- tips: a named person (photo + name), a team, or the whole café ----------
  quick.querySelector("[data-tip]").addEventListener("click", () => { drawTip(); openSheet($("tipSheet")); });
  const teams = () => session?.staff?.length ? session.staff.map((s, k) => ({ name: s.name, role: s.role, photo: s.photo, char: null, tint: TINT[k % TINT.length] }))
    : [{ name: T("barTeam"), char: "sip", tint: "#DDF3D8" }, { name: T("kitchenTeam"), char: "kroissant", tint: "#FFF0C2" }, { name: T("floorTeam"), char: "walk", tint: "#E6EEFF" }];
  const avStyle = (p) => p.photo ? `background-image:url('${esc(p.photo)}')` : p.char && KK ? `background-image:url('${CH(p.char)}');--tint:${p.tint}` : `--tint:${p.tint}`;
  function drawTip() {
    const people = [...teams(), { name: T("wholeCafe"), char: "hug", tint: "#FFE1EF" }];
    $("tipbody").innerHTML = `<p style="margin:0 0 12px;color:var(--muted);font-weight:600">${esc(T("tipWho"))}</p><div class="staff">${people.map((p, k) => `<button data-p="${k}"><span class="av2 ${p.photo ? "" : "char"}" style="${avStyle(p)}"></span><b>${esc(p.name)}</b>${p.role ? `<small>${esc(p.role)}</small>` : ""}</button>`).join("")}</div>`;
    $("tipbody").querySelectorAll("[data-p]").forEach((b) => b.onclick = () => tipFor(people[+b.dataset.p]));
  }
  function tipFor(p) {
    let amt = 50;
    const draw = () => {
      $("tipbody").innerHTML = `<div class="tipper"><div class="av2 ${p.photo ? "" : "char"}" style="${avStyle(p)}"></div><h4>${esc(p.name)}</h4>${p.role ? `<p>${esc(p.role)}</p>` : "<p></p>"}
        <div class="amts">${[20, 50, 100].map((a) => `<button data-a="${a}" class="${amt === a ? "on" : ""}">${a}</button>`).join("")}<button data-a="o" class="${[20, 50, 100].includes(amt) ? "" : "on"}">${esc(T("other"))}</button></div>
        <input id="tipamt" type="number" inputmode="numeric" min="5" max="2000" value="${amt}" ${[20, 50, 100].includes(amt) ? "hidden" : ""}>
        <input id="tipnote" maxlength="140" placeholder="${esc(T("tipNote"))}">
        <button class="iadd" id="tipgo"><i class="fa-solid fa-heart"></i>${esc(T("sendTip").replace("{a}", amt))}</button><br><button class="back" id="tipback">${esc(T("back"))}</button></div>`;
      $("tipbody").querySelectorAll("[data-a]").forEach((b) => b.onclick = () => { amt = b.dataset.a === "o" ? (amt > 100 ? amt : 150) : +b.dataset.a; draw(); if (b.dataset.a === "o") $("tipamt").focus(); });
      $("tipamt").oninput = () => { amt = Math.max(0, Math.round(+$("tipamt").value || 0)); $("tipgo").innerHTML = `<i class="fa-solid fa-heart"></i>${esc(T("sendTip").replace("{a}", amt))}`; };
      $("tipback").onclick = drawTip;
      $("tipgo").onclick = async () => {
        if (amt < 5) return $("tipamt").focus();
        $("tipgo").disabled = true;
        const r = await fetch(api("/api/widget/tip"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, target: p.name, amount: amt, note: $("tipnote").value }) }).then((x) => x.json()).catch(() => null);
        if (!r?.ok) { $("tipgo").disabled = false; return sys("fa-rotate-right", "Couldn't add the tip — try again."); }

      };

  }

  // ---------- "Me": what to call you, your phone (WhatsApp code), preferences, what we remember, forget me ----------
  async function saveMe(body) {
    const r = await fetch(api("/api/widget/me"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, ...body }) }).catch(() => null);
    const j = r ? await r.json().catch(() => null) : null;
    if (j?.guest_token) LS.set(guestKey, { token: j.guest_token });
    if (j?.profile) { profile = j.profile; if (profile.name) me = profile.name.split(" ")[0]; }
    return j;
  }
  async function startCode(phone, name, host, done) {
    const r = await fetch(api("/api/widget/otp/start"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, phone, name, lang }) }).then((x) => x.json()).catch(() => null);
    if (!r?.sent) { host.innerHTML = `<p class="hint">${esc(T(r?.error === "bad_phone" ? "badPhone" : "codesOff"))}</p>`; return false; }

    const go = async () => {
      const v = await fetch(api("/api/widget/otp/verify"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, code: $("otpin").value.trim() }) }).then((x) => x.json()).catch(() => null);
      if (v?.ok) { LS.set(guestKey, { token: v.guest_token }); profile = v.profile; if (profile?.name) me = profile.name.split(" ")[0]; buzz([20, 30, 20]); done?.(); return; }

  $("meBtn").onclick = () => { drawMe(); openSheet($("meSheet")); };

    $("meforget").onclick = async () => {
      await fetch(api("/api/widget/forget"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId }) }).catch(() => {});
      try { localStorage.removeItem(guestKey); localStorage.removeItem("kk:favs"); localStorage.removeItem("kk:avoid"); } catch {}
      profile = null; favs = []; avoid = []; me = "You"; if (session) session.guest = null; closeSheets(); sys("fa-user-slash", T("forgotten"));
    };

  // ---------- voice ordering (same transcription as WhatsApp voice notes) ----------
  let rec = null, chunks = [], recT;
  $("mic").onclick = async () => {
    if (rec?.state === "recording") return rec.stop();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported?.("audio/webm") ? "audio/webm" : MediaRecorder.isTypeSupported?.("audio/mp4") ? "audio/mp4" : "";
      rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); chunks = [];
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      rec.onstop = async () => {
        clearTimeout(recT); stream.getTracks().forEach((t) => t.stop()); $("mic").classList.remove("rec"); input.placeholder = T("ph");
        const blob = new Blob(chunks, { type: rec.mimeType || mime || "audio/webm" }); if (blob.size < 1500) return;
        showTyping(true);
        const b64 = await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
        const r = await fetch(api("/api/widget/voice"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, audio: b64, mime: blob.type }) }).then((x) => x.json()).catch(() => null);
        showTyping(false);
        if (!r?.text) return sys("fa-microphone-slash", T("heard"));
        input.value = r.text; sendMsg();
      };
      rec.start(); $("mic").classList.add("rec"); input.placeholder = T("recording"); buzz(15);
      recT = setTimeout(() => rec?.state === "recording" && rec.stop(), 30000);
    } catch { sys("fa-microphone-slash", "Microphone blocked — allow it in your browser, or type your order."); }
  };

  // ---------- after the session opens: taste greeting, habit offer, quiz later ----------
  async function afterSession(j) {
    profile = j.profile || null; me = j.guest?.name ? j.guest.name.split(" ")[0] : me;
    $("mic").disabled = !navigator.mediaDevices?.getUserMedia;
    if (profile?.language && profile.language !== lang && !LS.get("kk:lang")) { lang = profile.language; applyLang(); }
    applyLang();
    await ensureMenu();
    if (profile?.habit && !profile.default_milk) habitCard(profile.habit);
  }
  function habitCard(h) {
    const row = document.createElement("div"); row.className = "card";
    row.innerHTML = `<h4><i class="fa-solid fa-wand-magic-sparkles"></i>${esc(T("habitT").replace("{m}", h.milk + (/milk/i.test(h.milk) ? "" : " milk")))}</h4><p>${esc(T("habitP").replace("{n}", h.times).replace("{of}", h.of))}</p><div class="acts"><button class="wa" data-y style="background:var(--brand);border:0;font:inherit;font-weight:700;cursor:pointer">${esc(T("yesDefault"))}</button><button class="skip" data-n>${esc(T("noThanks"))}</button></div>`;
    log.appendChild(row); log.scrollTop = log.scrollHeight;
    row.querySelector("[data-n]").onclick = () => row.remove();
    row.querySelector("[data-y]").onclick = async () => {
      const r = await fetch(api("/api/widget/profile"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, default_milk: h.milk }) }).then((x) => x.json()).catch(() => null);
      if (r?.profile) profile = r.profile;
      row.innerHTML = `<h4><i class="fa-solid fa-circle-check"></i>${esc(T("habitDone").replace("{m}", h.milk))}</h4>`;
    };
  }

  setInterval(async () => { const g = await getGeo(); if (g) geo = g; }, 45000);
  start();
})();
</script>
