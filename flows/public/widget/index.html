<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order from your table</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  :root { --brand: #3DAE2B; --brand-soft: #e9f6e6; --ink: #14171a; --bg: #f6f7f4; --card: #fff; --muted: #6b7280; --ease: cubic-bezier(.2,.8,.2,1); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 560px; margin: 0 auto; background: var(--card); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--brand); color: #fff; }
  header img { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; background: rgba(255,255,255,.2); box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  header .t { flex: 1; min-width: 0; }
  header .name { font-weight: 800; font-size: 16px; }
  header .sub { font-size: 12.5px; opacity: .9; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.18); white-space: nowrap; transition: background .3s; }
  .pill.ok { background: rgba(255,255,255,.95); color: #1f7a16; }
  .pill.warn { background: #fff3e0; color: #a35a00; }
  #log { flex: 1; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(180deg, var(--bg), #fff 40%); scroll-behavior: smooth; }
  .row { display: flex; gap: 8px; align-items: flex-end; animation: in .32s var(--ease) both; }
  .row.me { justify-content: flex-end; }
  .av { flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 13px; }
  .msg { max-width: 84%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; unicode-bidi: plaintext; text-align: start; }
  /* each line takes its own direction from its first letter, so an Arabic bill with English dish names reads in order */
  .ai .msg { background: #fff; border: 1px solid rgba(0,0,0,.07); border-bottom-left-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.03); }
  .me .msg { background: var(--brand); color: #fff; border-bottom-right-radius: 6px; }
  .sys { align-self: center; color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; animation: in .3s both; }
  .msg img { max-width: 100%; border-radius: 12px; display: block; margin-top: 8px; }
  .msg a { color: inherit; font-weight: 600; }
  .msg .doc { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; padding: 8px 12px; border-radius: 12px; background: var(--brand-soft); color: #1f7a16; text-decoration: none; }
  .msg .rule { display: block; height: 1px; background: rgba(0,0,0,.1); margin: 6px 0; }
  .msg .ticket { display: flex; align-items: center; gap: 8px; font-weight: 800; color: #1f7a16; }
  @keyframes in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .typing .msg { display: inline-flex; gap: 4px; padding: 14px 16px; }
  .typing .msg span { width: 7px; height: 7px; border-radius: 50%; background: #b9c0c7; animation: dot 1.2s infinite; }
  .typing .msg span:nth-child(2) { animation-delay: .15s; } .typing .msg span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 14px 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--brand); color: var(--brand); background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; animation: in .3s var(--ease) both; transition: background .2s, color .2s, transform .15s; }
  .chip:hover { background: var(--brand); color: #fff; } .chip:active { transform: scale(.96); }
  .quick { display: flex; gap: 8px; padding: 0 14px 8px; overflow-x: auto; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--bg); border: 1px solid rgba(0,0,0,.08); border-radius: 999px; padding: 7px 12px; cursor: pointer; transition: border-color .2s, transform .15s; }
  .quick button i { color: var(--brand); } .quick button:hover { border-color: var(--brand); transform: translateY(-1px); }
  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(0,0,0,.06); background: #fff; }
  input { flex: 1; font: inherit; padding: 12px 16px; border: 1.5px solid #e3e5e8; border-radius: 999px; outline: none; transition: border-color .2s, box-shadow .2s; }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  button.send { width: 46px; height: 46px; flex: 0 0 46px; color: #fff; background: var(--brand); border: 0; border-radius: 50%; cursor: pointer; font-size: 17px; transition: transform .2s var(--ease), opacity .2s; }
  button.send:hover { transform: scale(1.06) rotate(-8deg); } button.send:disabled { opacity: .45; transform: none; }
  .gate { margin: auto; padding: 30px 24px; text-align: center; color: var(--muted); animation: in .4s both; }
  .gate i { font-size: 44px; color: var(--brand); } .gate h2 { color: var(--ink); font-size: 19px; margin: 14px 0 6px; }
  .banner { display: flex; align-items: center; gap: 10px; margin: 10px 14px 0; padding: 10px 12px; border-radius: 14px; background: var(--brand-soft); color: #1f5f17; font-size: 13.5px; animation: in .35s both; }
  .banner b { font-size: 16px; letter-spacing: .18em; color: var(--ink); }
  .banner i { color: var(--brand); font-size: 16px; }
  .banner button { margin-left: auto; font: inherit; font-weight: 700; font-size: 12.5px; color: var(--brand); background: #fff; border: 0; border-radius: 999px; padding: 6px 10px; cursor: pointer; }
  .card { margin: 4px 0 4px 36px; padding: 14px; border-radius: 18px; background: #fff; border: 1.5px solid var(--brand-soft); box-shadow: 0 6px 18px rgba(0,0,0,.05); animation: in .35s both; }
  .card h4 { margin: 0 0 4px; font-size: 15px; display: flex; gap: 8px; align-items: center; } .card h4 i { color: var(--brand); }
  .card p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
  .card .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .card .wa { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; color: #fff; background: #25D366; border-radius: 999px; padding: 9px 14px; font-size: 14px; }
  .card .skip { font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 9px 6px; }
  .gate .code { display: flex; gap: 8px; justify-content: center; margin: 16px 0 8px; }
  .gate .code input { width: 150px; text-align: center; font-size: 22px; letter-spacing: .4em; padding: 10px; border-radius: 14px; }
  .gate .go { font: inherit; font-weight: 700; color: #fff; background: var(--brand); border: 0; border-radius: 14px; padding: 0 16px; cursor: pointer; }
  .gate .mine { margin-top: 14px; font: inherit; font-weight: 700; color: #a35a00; background: #fff3e0; border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
  .gate .err { color: #b42318; font-size: 13px; min-height: 18px; }
  .hbtn { width: 38px; height: 38px; border-radius: 12px; border: 0; background: rgba(255,255,255,.18); color: #fff; font-size: 16px; cursor: pointer; transition: background .2s, transform .15s; }
  .hbtn:hover { background: rgba(255,255,255,.3); } .hbtn:active { transform: scale(.94); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(10,12,14,.38); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 50%; bottom: 0; width: min(560px, 100vw); transform: translate(-50%, 100%); z-index: 41; background: #fff; border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.18); transition: transform .32s var(--ease); max-height: 86dvh; display: flex; flex-direction: column; }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: #d6d9dd; margin: 10px auto 4px; }
  .sheet h3 { margin: 6px 18px 10px; font-size: 17px; display: flex; align-items: center; gap: 8px; } .sheet h3 i { color: var(--brand); }
  .sheet h3 .x { margin-left: auto; font: inherit; background: none; border: 0; font-size: 18px; color: var(--muted); cursor: pointer; }
  .calls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 18px 22px; }
  .calls button { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; border-radius: 16px; border: 1.5px solid #eceef0; background: #fff; font: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer; transition: border-color .2s, transform .15s; }
  .calls button i { font-size: 22px; color: var(--brand); } .calls button:hover { border-color: var(--brand); transform: translateY(-2px); }
  .sheet > * { flex-shrink: 0; } .sheet > .mlist { flex: 1 1 auto; min-height: 0; }
  .mtabs { display: flex; gap: 8px; overflow-x: auto; padding: 0 18px 10px; scrollbar-width: none; } .mtabs::-webkit-scrollbar { display: none; }
  .mtabs button { flex: 0 0 auto; font: inherit; font-size: 13px; font-weight: 700; padding: 8px 13px; border-radius: 999px; border: 1.5px solid #eceef0; background: #fff; cursor: pointer; }
  .mtabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .msearch { margin: 0 18px 10px; position: relative; } .msearch i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .msearch input { width: 100%; padding-left: 38px; border-radius: 14px; }
  .mlist { overflow-y: auto; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 8px; }
  .mi { display: grid; grid-template-columns: 54px 1fr auto 34px; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; border: 1px solid #eef0f2; animation: in .3s var(--ease) both; }
  .mi .ph { width: 54px; height: 54px; border-radius: 14px; background: var(--brand-soft) center/cover no-repeat; display: grid; place-items: center; color: var(--brand); font-size: 20px; }
  .mi b { font-size: 14.5px; } .mi small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; margin-top: 2px; }
  .mi .pr { font-weight: 800; font-size: 14px; text-align: right; } .mi .pr span { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .mi .add { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--brand); color: #fff; cursor: pointer; transition: transform .2s var(--ease); }
  .mi .add:hover { transform: rotate(90deg); }
  .mi.off { opacity: .45; } .mi.off .add { display: none; }
  .mi .badge { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; font-weight: 700; color: #a35a00; background: #fff3e0; border-radius: 999px; padding: 2px 7px; margin-left: 6px; }
  .mi .best { color: #1f7a16; background: var(--brand-soft); }
  .tracker { margin: 4px 0 4px 36px; padding: 12px 14px; border-radius: 18px; background: #fff; border: 1.5px solid var(--brand-soft); animation: in .35s both; }
  .tracker .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 10px; } .tracker .top b { color: var(--ink); }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .steps div { text-align: center; font-size: 11.5px; color: var(--muted); }
  .steps i { display: grid; place-items: center; width: 30px; height: 30px; margin: 0 auto 4px; border-radius: 50%; background: #f1f2f4; color: #b5bac1; transition: background .4s, color .4s; }
  .steps .done i { background: var(--brand); color: #fff; } .steps .done { color: var(--ink); font-weight: 700; }
  .steps .now i { background: var(--brand); color: #fff; box-shadow: 0 0 0 0 rgba(61,174,43,.5); animation: pulse 1.6s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(61,174,43,0); } 100% { box-shadow: 0 0 0 0 rgba(61,174,43,0); } }
  .stars { display: flex; gap: 6px; margin: 4px 0 10px; } .stars button { font-size: 26px; background: none; border: 0; color: #d6d9dd; cursor: pointer; transition: transform .15s, color .15s; }
  .stars button.on { color: #f5b301; } .stars button:hover { transform: scale(1.15); }
  .card textarea { width: 100%; font: inherit; padding: 10px 12px; border-radius: 12px; border: 1.5px solid #e3e5e8; resize: none; outline: none; margin-bottom: 8px; }
  .card .send2 { font: inherit; font-weight: 700; color: #fff; background: var(--brand); border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer; }
  .card .code.rem { display: flex; gap: 8px; margin: 10px 0 4px; } .card .code.rem input { flex: 1; min-width: 0; font: inherit; padding: 11px 13px; border-radius: 12px; border: 1.5px solid #e3e5e8; outline: none; } .card .code.rem input:focus { border-color: var(--brand); }
  .card .code.rem .go { width: 46px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; cursor: pointer; }
  .fine { font-size: 11.5px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
  .msg .doc { border: 0; font: inherit; font-weight: 700; cursor: pointer; }
  /* cart: browse the menu, fill a cart, hand it to the AI — it asks size/milk/extras next */
  .cartbar { display: flex; align-items: center; gap: 10px; margin: 0 14px 8px; padding: 10px 12px 10px 14px; border-radius: 16px; background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; animation: in .3s var(--ease) both; }
  .cartbar .ic { position: relative; font-size: 17px; } .cartbar .ic b { position: absolute; top: -8px; right: -10px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--brand); font-size: 11px; display: grid; place-items: center; }
  .cartbar .ic.bump { animation: bump .45s var(--ease); }
  @keyframes bump { 30% { transform: scale(1.35) rotate(-8deg); } 60% { transform: scale(.9); } }
  .cartbar .sum { flex: 1; min-width: 0; } .cartbar .sum small { display: block; font-weight: 500; opacity: .7; font-size: 12px; }
  .cartbar button { font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 9px 12px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
  .cartbar .view { background: rgba(255,255,255,.12); color: #fff; } .cartbar .go { background: var(--brand); color: #fff; }
  .sheet .cartbar { margin: 8px 18px 16px; }
  .mi .qty, .cl .qty { display: inline-flex; align-items: center; gap: 2px; background: var(--brand-soft); border-radius: 10px; padding: 2px; }
  .qty button { width: 28px; height: 28px; border: 0; border-radius: 8px; background: #fff; color: var(--brand); font-size: 12px; cursor: pointer; }
  .qty span { min-width: 20px; text-align: center; font-weight: 800; font-size: 14px; }
  .mi:has(.qty) { grid-template-columns: 54px 1fr auto auto; }
  .clist { overflow-y: auto; padding: 0 18px; display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto !important; min-height: 0; }
  .cl { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 8px; border-radius: 14px; border: 1px solid #eef0f2; animation: in .25s both; }
  .cl .ph { width: 46px; height: 46px; border-radius: 12px; background: var(--brand-soft) center/cover no-repeat; display: grid; place-items: center; color: var(--brand); }
  .cl b { font-size: 14px; } .cl small { display: block; color: var(--muted); font-size: 12.5px; }
  .ctot { display: flex; justify-content: space-between; padding: 12px 18px 0; font-weight: 800; } .ctot span:last-child { color: var(--brand); }
  .cnote { padding: 6px 18px 0; color: var(--muted); font-size: 12.5px; display: flex; gap: 6px; align-items: center; } .cnote i { color: var(--brand); }
  .cacts { display: flex; gap: 8px; padding: 12px 18px 18px; }
  .cacts button { flex: 1; font: inherit; font-weight: 800; border-radius: 14px; padding: 13px; cursor: pointer; display: inline-flex; justify-content: center; gap: 8px; align-items: center; }
  .cacts .more { background: #fff; border: 1.5px solid #e3e5e8; color: var(--ink); } .cacts .go { background: var(--brand); color: #fff; border: 0; flex: 1.4; }
  .docframe { flex: 1 1 auto !important; min-height: 60dvh; border: 0; margin: 0 12px 12px; border-radius: 12px; background: #f1f2f4; }
  .fly { position: fixed; z-index: 60; width: 34px; height: 34px; border-radius: 50%; background: var(--brand) center/cover; pointer-events: none; transition: transform .6s cubic-bezier(.5,-.3,.7,1), opacity .6s; }
  .mi .ph.photo, .cl .ph.photo { background-size: cover; }
  .mi .ph.char, .cl .ph.char { background-color: var(--tint); background-size: 88%; background-position: center 70%; }
  .mi .ph { cursor: pointer; }
  .mi .add { position: relative; } .mi .add em { position: absolute; top: -7px; right: -7px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--ink); color: #fff; font: 700 11px/18px inherit; font-style: normal; }
  .cl small.lp { color: var(--ink); font-weight: 700; }
  .ix { position: absolute; right: 14px; top: 12px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); box-shadow: 0 2px 8px rgba(0,0,0,.12); font-size: 16px; cursor: pointer; }
  .ibody { overflow-y: auto; flex: 1 1 auto !important; min-height: 0; padding: 0 18px 8px; }
  .ihero { height: 190px; border-radius: 18px; margin: 4px 0 12px; background: var(--brand-soft) center/cover no-repeat; }
  .ihero.char { background-color: var(--tint); background-size: contain; background-position: center bottom; }
  .ihead h4 { margin: 0; font-size: 20px; } .ihead p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .ogrp { margin-top: 16px; } .olab { font-weight: 800; font-size: 14.5px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .olab span { font-weight: 600; font-size: 11.5px; color: var(--muted); background: #f1f2f4; border-radius: 999px; padding: 2px 8px; } .olab .req { color: #a35a00; background: #fff3e0; }
  .ochips { display: flex; flex-wrap: wrap; gap: 8px; }
  .oc { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 14px; font-weight: 600; padding: 9px 13px; border-radius: 12px; border: 1.5px solid #e3e5e8; background: #fff; cursor: pointer; transition: border-color .15s, background .15s; }
  .oc small { color: var(--muted); font-weight: 600; } .oc.on { border-color: var(--brand); background: var(--brand-soft); color: #1f7a16; } .oc.on i { color: var(--brand); }
  .ogrp textarea { width: 100%; font: inherit; font-size: 14px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid #e3e5e8; resize: none; outline: none; } .ogrp textarea:focus { border-color: var(--brand); }
  .ifoot { display: flex; gap: 10px; align-items: center; padding: 12px 18px 18px; border-top: 1px solid #f0f1f3; }
  .qty.big button { width: 36px; height: 36px; } .qty.big span { min-width: 26px; font-size: 16px; }
  .iadd { flex: 1; font: inherit; font-weight: 800; font-size: 15.5px; color: #fff; background: var(--brand); border: 0; border-radius: 14px; padding: 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
  .iadd:disabled { background: #c9ccd1; cursor: default; }
  .moods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .moods button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 14px; border: 1.5px solid #eceef0; background: #fff; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: border-color .15s, transform .15s; }
  .moods button i { font-size: 20px; color: var(--brand); } .moods button:hover:not(:disabled) { border-color: var(--brand); transform: translateY(-2px); }
  .moods button.on { border-color: var(--brand); background: var(--brand-soft); } .moods button:disabled:not(.on) { opacity: .45; }
  .card.usual p b { color: var(--ink); } .card.usual .wa { background: var(--brand); border: 0; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  [dir="rtl"] { text-align: right; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <img id="logo" alt="" hidden>
    <div class="t"><div class="name" id="rname">Connecting</div><div class="sub" id="rsub"><i class="fa-solid fa-circle-notch fa-spin"></i> Finding your table</div></div>
    <span class="pill" id="geo"><i class="fa-solid fa-location-crosshairs"></i></span>
    <button class="hbtn" id="callBtn" aria-label="Call staff" title="Call staff" hidden><i class="fa-solid fa-bell-concierge"></i></button>
  </header>
  <div id="banner"></div>
  <div id="log"></div>
  <div class="chips" id="chips"></div>
  <div class="quick" id="quick" hidden>
    <button data-menu><i class="fa-solid fa-book-open"></i>Menu</button>
    <button data-q="What do you recommend?"><i class="fa-solid fa-star"></i>Recommend</button>
    <button data-q="Something with matcha"><i class="fa-solid fa-leaf"></i>Matcha</button>
    <button data-q="What pastries do you have?"><i class="fa-solid fa-bread-slice"></i>Pastries</button>
    <button data-q="Where is my order?"><i class="fa-solid fa-receipt"></i>My order</button>
  </div>
  <div class="sheet-bg" id="sbg"></div>
  <div class="sheet" id="callSheet"><div class="grab"></div><h3><i class="fa-solid fa-bell-concierge"></i>Call staff to your table<button class="x" data-close><i class="fa-solid fa-xmark"></i></button></h3>
    <div class="calls"><button data-call="help"><i class="fa-solid fa-hand"></i>Need help</button><button data-call="bill"><i class="fa-solid fa-receipt"></i>The bill</button><button data-call="water"><i class="fa-solid fa-glass-water"></i>Water</button></div></div>
  <div class="sheet" id="menuSheet"><div class="grab"></div><h3><i class="fa-solid fa-book-open"></i>Menu<button class="x" data-close><i class="fa-solid fa-xmark"></i></button></h3>
    <div class="mtabs" id="mtabs"></div><div class="msearch"><i class="fa-solid fa-magnifying-glass"></i><input id="mq" placeholder="Search — matcha, pistachio…" autocomplete="off"></div><div class="mlist" id="mlist"></div><div id="mcart"></div></div>
  <div id="cartHost"></div>
  <div class="sheet" id="cartSheet"><div class="grab"></div><h3><i class="fa-solid fa-basket-shopping"></i>Your cart<button class="x" data-close><i class="fa-solid fa-xmark"></i></button></h3>
    <div class="clist" id="clist"></div><div class="ctot"><span>Total</span><span id="ctot"></span></div>
    <div class="cnote"><i class="fa-solid fa-wand-magic-sparkles"></i>The AI checks any choices with you (size, milk), then confirms.</div>
    <div class="cacts"><button class="more" id="cmore"><i class="fa-solid fa-plus"></i>Add more</button><button class="go" id="cgo"><i class="fa-solid fa-paper-plane"></i>Send to order</button></div></div>
  <div class="sheet" id="itemSheet"><div class="grab"></div><button class="x ix" data-close aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    <div class="ibody" id="ibody"></div>
    <div class="ifoot"><span class="qty big"><button id="iminus" aria-label="One less"><i class="fa-solid fa-minus"></i></button><span id="iqty">1</span><button id="iplus" aria-label="One more"><i class="fa-solid fa-plus"></i></button></span><button class="iadd" id="iadd">Add</button></div></div>
  <div class="sheet" id="docSheet"><div class="grab"></div><h3><i class="fa-solid fa-receipt"></i><span id="doct">Receipt</span><button class="x" data-close><i class="fa-solid fa-xmark"></i></button></h3><iframe class="docframe" id="docf" title="Document"></iframe></div>
  <form id="f"><input id="in" placeholder="Type your order…" autocomplete="off" disabled><button class="send" id="send" disabled aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button></form>
</div>
<script>
(() => {
  const token = decodeURIComponent(location.pathname.split("/t/")[1] || "") || new URLSearchParams(location.search).get("t") || "";
  const slug = new URLSearchParams(location.search).get("r") || "koffee-kulture";
  const api = (p) => `${location.origin}${p}`;
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("in"), send = $("send"), chips = $("chips"), geoPill = $("geo"), quick = $("quick"), banner = $("banner");
  let booted = false, session = null, lastAt = null, geo = null, polling = null, typingRow = null, askedRemember = false, identifyTimer = null;
  const seen = new Set();
  const LS = { get: (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const device = LS.get("kk:device") || (() => { const d = Math.random().toString(36).slice(2) + Date.now().toString(36); LS.set("kk:device", d); return d; })();
  const guestKey = `kk:guest:${slug}`;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ICON = { "🎫": "fa-ticket", "🧾": "fa-receipt", "📍": "fa-location-dot", "💳": "fa-credit-card", "✅": "fa-circle-check", "⭐": "fa-star", "🕐": "fa-clock", "🔥": "fa-fire", "🍟": "fa-plus" };
  const EMOJI = /(?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|‍(?:\p{Extended_Pictographic}))*/gu;
  function render(text) {
    let h = esc(text || "")
      .replace(/^[―—\-]{6,}$/gm, '<span class="rule"></span>')
      .replace(/\*([^*\n]+)\*/g, "<b>$1</b>")
      .replace(/(^|\s)_([^_\n]+)_/g, "$1<i>$2</i>")
      .replace(/(?:📄\s*)?(https?:\/\/[^\s<]+\.pdf)/g, (_, u) => /\/receipts?\//i.test(u)
        ? `<button class="doc" data-doc="${u}"><i class="fa-solid fa-receipt"></i>View receipt</button>`
        : `<button class="doc" data-openmenu><i class="fa-solid fa-book-open"></i>Open the menu</button>`)
      .replace(/(^|[^"])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    h = h.replace(EMOJI, (e) => { const k = Object.keys(ICON).find((x) => e.startsWith(x)); return k ? `<i class="fa-solid ${ICON[k]}" style="color:var(--brand)"></i>` : ""; });
    // English runs inside an Arabic line (dish names, "Oat", "EGP 305") are isolated so the
    // brackets and dots around them stay where they were typed instead of jumping sides
    h = h.split("\n").map((line) => /[\u0600-\u06FF]/.test(line) ? line.replace(/(?<![<\w="\/-])([A-Za-z][A-Za-z0-9.&'%-]*(?:[ ][A-Za-z0-9][A-Za-z0-9.&'%-]*)*)(?![^<]*>)/g, "<bdi>$1</bdi>") : line).join("\n");
    return h.replace(/ {2,}/g, " ").replace(/^ +| +$/gm, "");
  }
  function add(kind, text, media) {
    const row = document.createElement("div");
    row.className = `row ${kind}`;
    const body = `<div class="msg">${render(text)}${media ? `<img src="${esc(media)}" alt="">` : ""}</div>`;
    row.innerHTML = kind === "ai" ? `<div class="av"><i class="fa-solid fa-mug-hot"></i></div>${body}` : body;
    if (/[؀-ۿ]/.test(text || "")) row.querySelector(".msg").dir = "rtl";
    row.querySelectorAll("[data-openmenu]").forEach((b) => b.onclick = openMenu);
    row.querySelectorAll("[data-doc]").forEach((b) => b.onclick = () => { $("docf").src = b.dataset.doc; openSheet($("docSheet")); });
    log.appendChild(row); log.scrollTop = log.scrollHeight;
  }
  function sys(icon, text) { const d = document.createElement("div"); d.className = "sys"; d.innerHTML = `<i class="fa-solid ${icon}"></i>${esc(text)}`; log.appendChild(d); log.scrollTop = log.scrollHeight; }
  function showTyping(on) {
    if (on && !typingRow) { typingRow = document.createElement("div"); typingRow.className = "row ai typing"; typingRow.innerHTML = '<div class="av"><i class="fa-solid fa-mug-hot"></i></div><div class="msg"><span></span><span></span><span></span></div>'; log.appendChild(typingRow); log.scrollTop = log.scrollHeight; }
    if (!on && typingRow) { typingRow.remove(); typingRow = null; }
  }
  const CHIP_ICON = (l) => /confirm|تأكيد|akked/i.test(l) ? "fa-check" : /change|عدّل|edit/i.test(l) ? "fa-pen" : /cash|كاش/i.test(l) ? "fa-money-bill-wave" : /card|كارت/i.test(l) ? "fa-credit-card" : /menu|منيو/i.test(l) ? "fa-book-open" : /yes|أيوه|aywa/i.test(l) ? "fa-thumbs-up" : /^no$|لا/i.test(l) ? "fa-xmark" : "fa-angle-right";
  function chipsFrom(text) {
    chips.innerHTML = "";
    const line = (text || "").split("\n").find((l) => l.trim().startsWith("▸"));
    if (!line) return;
    line.split("▸").map((x) => x.replace(EMOJI, "").trim()).filter(Boolean).slice(0, 4).forEach((label, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.style.animationDelay = `${i * 60}ms`;
      b.innerHTML = `<i class="fa-solid ${CHIP_ICON(label)}"></i>${esc(label)}`;
      b.onclick = /^(browse |see |show |the |full )*(menu|المنيو|منيو|el menu)$/i.test(label) ? () => { chips.innerHTML = ""; openMenu(); } : () => { input.value = label; sendMsg(); };
      chips.appendChild(b);
    });
  }
  const stripChipLine = (t) => (t || "").split("\n").filter((l) => !l.trim().startsWith("▸")).join("\n").trim();
  function setGeoPill(status, dist) {
    const map = { ok: ["ok", "fa-location-dot", "At the café"], outside: ["warn", "fa-location-arrow", dist ? `${dist > 999 ? (dist / 1000).toFixed(1) + " km" : dist + " m"} away` : "Not here"], missing: ["warn", "fa-location-crosshairs", "Location off"] };
    const [cls, ic, label] = map[status] || ["", "fa-location-crosshairs", ""];
    geoPill.className = `pill ${cls}`; geoPill.innerHTML = `<i class="fa-solid ${ic}"></i>${label}`;
  }
  function getGeo() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition((p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }), () => resolve(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
    });
  }
  function setBanner(code, members) {
    if (!code || session?.showroom) { banner.innerHTML = ""; return; }
    banner.innerHTML = `<div class="banner"><i class="fa-solid fa-users"></i><span>Table code <b>${esc(code)}</b><br>Friends at this table enter it to order too${members > 1 ? ` · ${members} phones` : ""}</span></div>`;
  }

  async function openSession(extra = {}) {
    const saved = LS.get("kk:" + token);
    const guest = LS.get(guestKey);
    const r = await fetch(api("/api/widget/session"), { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slug, token, geo, device, sessionId: saved?.sessionId || null, guest_token: guest?.token || null, ...extra }) }).catch(() => null);
    if (!r) return { error: "network" };
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return { error: j.error || "failed" };
    return j;
  }

  // an expired visit renews itself from the same table code — no dead end for a returning guest
  async function renew() {
    try { localStorage.removeItem("kk:" + token); } catch {}
    const j = await openSession();
    if (j.error) return gate("fa-hourglass-end", "Your table session ended", "Scan the code on your table again to keep ordering.");
    handleSession(j);
  }

  async function start() {
    if (!token) return gate("fa-qrcode", "Scan the code on your table", "It opens this chat already knowing where you sit.");
    geo = await getGeo();
    const j = await openSession();
    if (j.error) return gate("fa-triangle-exclamation", j.error === "bad table token" ? "This code isn't valid" : "Couldn't open your table", j.error === "bad table token" ? "Ask for a fresh one at the counter." : "Check your connection and try again.");
    handleSession(j);
  }

  function handleSession(j) {
    if (j.status === "claimed") return claimedGate(j.table);
    if (j.status === "bad_code") return claimedGate(j.table, "That code doesn't match — check the phone that started the order.");
    if (j.status === "dispute_limit") return claimedGate(j.table, "You've already reported a table today — please ask at the counter.");
    session = j;
    LS.set("kk:" + token, { sessionId: j.sessionId, expires_at: j.expires_at });
    const R = j.restaurant || {};
    document.documentElement.style.setProperty("--brand", R.primary || "#3DAE2B");
    $("rname").textContent = R.name || "Order";
    $("rsub").innerHTML = `<i class="fa-solid fa-chair"></i> Table ${esc(j.table)}${j.branch?.name ? ` · ${esc(j.branch.name)}` : ""}`;
    if (R.logo) { $("logo").src = R.logo; $("logo").hidden = false; }
    document.title = `${R.name || "Order"} · Table ${j.table}`;
    setGeoPill(j.showroom ? "ok" : (j.geofence?.status || "unknown"), j.geofence?.distance_m);
    setBanner(j.join_code, 1);
    log.innerHTML = ""; seen.clear(); lastAt = null;
    const greet = (R.greeting || "Welcome!").replace(EMOJI, "").replace(/ {2,}/g, " ").trim();
    const name = j.guest?.name ? j.guest.name.split(" ")[0] : null;
    if (j.disputed) sys("fa-flag", "Table reclaimed — the counter has been told someone else was ordering here.");
    if (j.status === "member") add("ai", `You've joined *table ${j.table}*. Order anything — it all goes on the same table.`);
    else if (name && j.guest?.usual?.length) add("ai", `Welcome back, *${name}*! You're at *table ${j.table}*.`);
    else add("ai", name ? `Welcome back, *${name}*! You're at *table ${j.table}*. What are we having today?` : `${greet}\n\nYou're at *table ${j.table}*. Tell me what you'd like, or tap the menu below.`);
    if (j.guest) askedRemember = true;
    if (j.status !== "member") { if (j.guest?.usual?.length) usualCard(j.guest.usual); else moodCard(!!name); }
    if (j.guest?.usual?.length && !quick.querySelector("[data-usual]")) {
      const b = document.createElement("button"); b.dataset.usual = "1"; b.innerHTML = '<i class="fa-solid fa-rotate-left"></i>My usual';
      b.addEventListener("click", () => repeatUsual(j.guest.usual)); quick.prepend(b);
    }
    if (!quick.querySelector("[data-mood]")) { const b = document.createElement("button"); b.dataset.mood = "1"; b.innerHTML = '<i class="fa-solid fa-face-smile"></i>Pick for my mood'; b.addEventListener("click", () => moodCard(true, true)); quick.insertBefore(b, quick.children[1] || null); }
    input.disabled = false; send.disabled = false; quick.hidden = false; $("callBtn").hidden = false;
    clearInterval(polling); poll(); polling = setInterval(poll, 2000);
    loadCart().then(() => toParent({ type: "kk:ready" }));
  }

  function claimedGate(table, err = "") {
    clearInterval(polling); banner.innerHTML = ""; quick.hidden = true; input.disabled = send.disabled = true;
    $("rname").textContent = "Koffee Kulture"; $("rsub").innerHTML = `<i class="fa-solid fa-chair"></i> Table ${esc(table || "")}`;
    log.innerHTML = `<div class="gate"><i class="fa-solid fa-user-lock"></i><h2>This table already has an open order</h2>
      <p>Joining friends? Enter the 4-digit table code from the phone that started the order.</p>
      <div class="code"><input id="jc" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="one-time-code"><button class="go" id="jgo"><i class="fa-solid fa-arrow-right"></i></button></div>
      <div class="err">${esc(err)}</div>
      <button class="mine" id="mine"><i class="fa-solid fa-flag"></i>That's not my table — I'm sitting here</button></div>`;
    const jc = $("jc"); jc.focus();
    const join = async () => { if (!/^\d{4}$/.test(jc.value)) return; const j = await openSession({ join_code: jc.value }); j.error ? claimedGate(table, "Couldn't join — try again.") : handleSession(j); };
    $("jgo").onclick = join; jc.addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });
    jc.addEventListener("input", () => { if (/^\d{4}$/.test(jc.value)) join(); });
    $("mine").onclick = async () => { const j = await openSession({ not_mine: true }); j.error ? claimedGate(table, "Couldn't reclaim — ask at the counter.") : handleSession(j); };
  }
  function gate(icon, title, text) { log.innerHTML = `<div class="gate"><i class="fa-solid ${icon}"></i><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`; quick.hidden = true; banner.innerHTML = ""; input.disabled = send.disabled = true; }

  function rememberCard() {
    if (askedRemember) return;
    askedRemember = true;
    const row = document.createElement("div"); row.className = "card";
    row.innerHTML = `<h4><i class="fa-solid fa-heart"></i>Want us to remember you?</h4><p>Next visit we'll greet you by name and have your usual one tap away.</p>
      <div class="code rem"><input id="rname2" maxlength="30" placeholder="Your first name" autocomplete="given-name"><button class="go" id="rgo" aria-label="Remember me"><i class="fa-solid fa-check"></i></button></div>
      <div class="acts"><button class="skip" id="skip">Not now</button></div>
      <div class="fine"><i class="fa-solid fa-lock"></i> Saved on this phone only — no number needed. We keep your name and orders at this café; ask staff any time to delete them.</div>`;
    log.appendChild(row); log.scrollTop = log.scrollHeight;
    $("skip").onclick = () => row.remove();
    const save = async () => {
      const name = $("rname2").value.trim(); if (!name) return $("rname2").focus();
      $("rgo").disabled = true;
      const r = await fetch(api("/api/widget/remember"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, name }) }).catch(() => null);
      const j = r && r.ok ? await r.json() : null;
      if (!j?.guest_token) { $("rgo").disabled = false; return sys("fa-rotate-right", "Couldn't save that — try again."); }
      LS.set(guestKey, { token: j.guest_token });
      row.innerHTML = `<h4><i class="fa-solid fa-circle-check"></i>Nice to meet you, ${esc(j.name.split(" ")[0])}!</h4><p>We'll remember you next time you sit down.</p>`;
    };
    $("rgo").onclick = save; $("rname2").addEventListener("keydown", (e) => { if (e.key === "Enter") save(); });
  }

  async function poll() {
    if (!session) return;
    const u = new URL(api("/api/widget/poll")); u.searchParams.set("slug", slug); u.searchParams.set("token", token); u.searchParams.set("sessionId", session.sessionId); if (lastAt) u.searchParams.set("since", lastAt);
    let r; try { r = await fetch(u); } catch { return; }
    if (r.status === 409) { clearInterval(polling); return gate("fa-user-slash", "Someone at this table took it over", "If this is your table, scan its code again and tap “That's not my table”."); }
    if (r.status === 410) { clearInterval(polling); return renew(); }
    if (!r.ok) return;
    const j = await r.json();
    setTimeout(() => { booted = true; }, 0);
    setBanner(j.join_code, j.members);
    for (const o of j.orders || []) drawTracker(o);
    for (const m of j.messages || []) {
      const key = `${m.at}|${m.sender}|${(m.message || "").slice(0, 40)}`;
      if (seen.has(key)) continue; seen.add(key); lastAt = m.at;
      if (m.sender === "ai" || m.sender === "staff") {
        showTyping(false); add("ai", stripChipLine(m.message), m.media_type === "image" ? m.media_url : null); chipsFrom(m.message);
        if (booted && /\.pdf\b/.test(m.message || "") && !/\/receipts?\//i.test(m.message || "")) setTimeout(openMenu, 500);
        if (/O-[A-Z0-9]{4}/.test(m.message || "")) setTimeout(rememberCard, 900);
      }
    }
  }
  // ---------- live order tracker + rating ----------
  const STAGE = (st) => ["pending", "accepted", "received", "new"].includes(st) ? 0 : ["preparing", "in_progress", "cooking"].includes(st) ? 1 : st === "ready" ? 2 : ["served", "delivered", "completed", "closed"].includes(st) ? 3 : st === "cancelled" ? -1 : 0;
  const trackers = {};
  let rated = false;
  function drawTracker(o) {
    const stage = STAGE(o.status);
    let el = trackers[o.code];
    if (!el) { el = document.createElement("div"); el.className = "tracker"; trackers[o.code] = el; log.appendChild(el); log.scrollTop = log.scrollHeight; }
    if (el.dataset.stage === String(stage)) return;
    el.dataset.stage = String(stage);
    const labels = [["fa-receipt", "Received"], ["fa-mug-hot", "Making"], ["fa-bell", "Ready"], ["fa-circle-check", "Served"]];
    el.innerHTML = stage < 0 ? `<div class="top"><span><i class="fa-solid fa-ban"></i> Order <b>${esc(o.code)}</b> was cancelled</span></div>`
      : `<div class="top"><span>Order <b>${esc(o.code)}</b></span><span>${esc((o.items || []).join(" · ")).slice(0, 60)}</span></div><div class="steps">${labels.map(([ic, l], i) => `<div class="${i < stage ? "done" : i === stage ? "now" : ""}"><i class="fa-solid ${ic}"></i>${l}</div>`).join("")}</div>`;
    if (stage === 3 && !rated) setTimeout(rateCard, 1500);
    else if (stage >= 0 && !rated && Date.now() - new Date(o.at).getTime() > 25 * 60_000) setTimeout(rateCard, 1500);
  }
  function rateCard() {
    if (rated) return; rated = true;
    const row = document.createElement("div"); row.className = "card";
    row.innerHTML = `<h4><i class="fa-solid fa-star"></i>How was everything?</h4><div class="stars">${[1, 2, 3, 4, 5].map((n) => `<button data-r="${n}" aria-label="${n} stars"><i class="fa-solid fa-star"></i></button>`).join("")}</div><div id="rmore"></div>`;
    log.appendChild(row); log.scrollTop = log.scrollHeight;
    const stars = row.querySelectorAll("[data-r]");
    stars.forEach((b) => { b.onmouseenter = () => stars.forEach((x) => x.classList.toggle("on", +x.dataset.r <= +b.dataset.r)); b.onclick = () => pick(+b.dataset.r); });
    async function pick(n) {
      stars.forEach((x) => { x.classList.toggle("on", +x.dataset.r <= n); x.disabled = true; });
      const more = row.querySelector("#rmore");
      const submit = async (comment = "") => {
        const r = await fetch(api("/api/widget/feedback"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, rating: n, comment }) }).then((x) => x.json()).catch(() => null);
        more.innerHTML = n >= 4 && r?.review_url ? `<p>Thank you! Would you share it on Google? It helps us a lot.</p><a class="wa" style="background:var(--brand)" href="${esc(r.review_url)}" target="_blank" rel="noopener"><i class="fa-brands fa-google"></i>Leave a review</a>` : `<p>Thank you — the manager will read this today.</p>`;
      };
      if (n >= 4) return submit();
      more.innerHTML = `<p>Sorry about that. What went wrong? Only the manager sees this.</p><textarea id="rc" rows="2" placeholder="Tell us briefly…"></textarea><button class="send2" id="rs">Send</button>`;
      row.querySelector("#rs").onclick = () => submit(row.querySelector("#rc").value);
    }
  }

  async function sendMsg() {
    const text = input.value.trim(); if (!text || !session) return;
    input.value = ""; chips.innerHTML = ""; add("me", text); showTyping(true);
    if (!geo) geo = await getGeo();
    const r = await fetch(api("/api/widget/send"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, message: text, geo }) }).catch(() => null);
    if (r?.status === 409) { showTyping(false); clearInterval(polling); return gate("fa-user-slash", "Someone at this table took it over", "If this is your table, scan its code again and tap “That's not my table”."); }
    if (r?.status === 410) { showTyping(false); clearInterval(polling); await renew(); input.value = text; return sendMsg(); }
    if (!r || !r.ok) { showTyping(false); return sys("fa-rotate-right", "Couldn't send that — try again."); }
    const j = await r.json().catch(() => ({}));
    if (j.geofence && !session.showroom) setGeoPill(j.geofence);
  }
  $("f").addEventListener("submit", (e) => { e.preventDefault(); sendMsg(); });
  quick.querySelectorAll("button[data-q]").forEach((b) => b.addEventListener("click", () => { input.value = b.dataset.q; sendMsg(); }));
  quick.querySelector("[data-menu]").addEventListener("click", openMenu);

  // ---------- sheets ----------
  const sbg = $("sbg");
  function openSheet(el) { document.querySelectorAll(".sheet.open").forEach((x) => x.classList.remove("open")); el.classList.add("open"); sbg.classList.add("open"); }
  function closeSheets() { document.querySelectorAll(".sheet.open").forEach((x) => x.classList.remove("open")); sbg.classList.remove("open"); }
  sbg.onclick = closeSheets; document.querySelectorAll("[data-close]").forEach((b) => b.onclick = closeSheets);
  // call staff
  $("callBtn").onclick = () => openSheet($("callSheet"));
  document.querySelectorAll("[data-call]").forEach((b) => b.onclick = async () => {
    closeSheets();
    const r = await fetch(api("/api/widget/call-staff"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, reason: b.dataset.call }) }).then((x) => x.json()).catch(() => null);
    if (!r?.ok) return sys("fa-rotate-right", "Couldn't reach the counter — try again.");
    sys("fa-bell-concierge", r.already ? "Staff already know — someone is on the way." : "Staff are on their way to your table.");
  });
  // menu drawer
  let MENU = null, mcat = null;
  async function openMenu() {
    openSheet($("menuSheet"));
    if (!MENU) await ensureMenu();
    if (MENU) drawMenu();
  }
  async function ensureMenu() {
    if (!MENU) {
      $("mlist").innerHTML = '<div class="sys"><i class="fa-solid fa-circle-notch fa-spin"></i>Loading the menu</div>';
      const u = new URL(api("/api/widget/menu")); u.searchParams.set("slug", slug); u.searchParams.set("token", token);
      MENU = await fetch(u).then((x) => x.json()).catch(() => null);
      if (!MENU?.categories) { MENU = null; $("mlist").innerHTML = '<div class="sys">Menu unavailable — ask in the chat.</div>'; return; }
      $("mtabs").innerHTML = MENU.categories.map((c, i) => `<button data-c="${esc(c.name)}" class="${i ? "" : "on"}">${esc(c.name)}</button>`).join("");
      $("mtabs").querySelectorAll("button").forEach((b) => b.onclick = () => { $("mq").value = ""; mcat = b.dataset.c; $("mtabs").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); drawMenu(); });
      mcat = MENU.categories[0]?.name;
    }
  }
  function drawMenu() {
    const q = $("mq").value.trim().toLowerCase();
    const list = MENU.categories.filter((c) => q || c.name === mcat).flatMap((c) => c.items).filter((i) => !q || `${i.name} ${i.description}`.toLowerCase().includes(q));
    $("mlist").innerHTML = list.map((i, k) => `<div class="mi ${i.unavailable ? "off" : ""}" style="animation-delay:${Math.min(k, 10) * 30}ms">
      ${phHTML(i)}
      <div><b>${esc(i.name)}</b>${i.bestseller ? '<span class="badge best"><i class="fa-solid fa-star"></i>Popular</span>' : ""}${i.unavailable ? `<span class="badge">${i.unavailable === "sold_out" ? "Sold out" : "Not now"}</span>` : ""}<small>${esc(i.description || "")}</small></div>
      <div class="pr">${i.price}${i.price_l ? ` / ${i.price_l}` : ""}<span>${esc(MENU.currency)}${i.price_l ? " · M / L" : ""}</span></div>${i.options?.length ? `<button class="add" data-pick="${esc(i.name)}" aria-label="Choose ${esc(i.name)}"><i class="fa-solid fa-plus"></i>${cartQty(i.name) ? `<em>${cartQty(i.name)}</em>` : ""}</button>` : cartQty(i.name) ? `<span class="qty"><button data-dec="${esc(i.name)}" aria-label="One less"><i class="fa-solid fa-minus"></i></button><span>${cartQty(i.name)}</span><button data-inc="${esc(i.name)}" aria-label="One more"><i class="fa-solid fa-plus"></i></button></span>` : `<button class="add" data-inc="${esc(i.name)}" aria-label="Add ${esc(i.name)}"><i class="fa-solid fa-plus"></i></button>`}</div>`).join("") || '<div class="sys">Nothing matches.</div>';
    wireQty($("mlist"));
    $("mlist").querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => openItem(b.dataset.pick));
    $("mlist").querySelectorAll(".mi").forEach((row) => { const b = row.querySelector("[data-pick],[data-inc]"); row.querySelector(".ph").onclick = () => b && openItem(b.dataset.pick || b.dataset.inc); });
  }
  $("mq").addEventListener("input", drawMenu);

  // ---------- art: the café's own photos, else its characters (Koffee Kulture), else an icon ----------
  const ART = slug === "koffee-kulture" ? ["char-chair", "char-sip", "char-dance", "char-hug", "char-walk", "char-guitar", "char-kroissant", "char-travel"].map((n) => `https://munadim.com/koffee/${n}.png`) : null;
  const TINT = ["#FFE1EF", "#DDF3D8", "#FFF0C2", "#FFE6D6", "#E6EEFF", "#F1E6FF"];
  const hash = (t) => [...t].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const artOf = (i) => i?.photo ? { src: i.photo, photo: true } : ART ? { src: ART[hash(i?.category || i?.name || "") % ART.length], photo: false } : null;
  const tintOf = (i) => TINT[hash(i?.name || "") % TINT.length];
  function phHTML(i, cls = "ph") {
    const a = artOf(i);
    if (!a) return `<div class="${cls}"><i class="fa-solid fa-mug-hot"></i></div>`;
    return `<div class="${cls} ${a.photo ? "photo" : "char"}" style="background-image:url('${esc(a.src)}');--tint:${tintOf(i)}"></div>`;
  }

  // ---------- item sheet: size / milk / extras / side + comments, live price ----------
  let picking = null;
  function linePrice(it, picks) {
    let p = Number(it.price) || 0;
    for (const g of it.options || []) for (const c of g.choices) if ((picks[g.key] || []).includes(c.name)) { if (c.price != null) p = c.price; else if (c.delta) p += c.delta; }
    return p;
  }
  function openItem(name, fromSite) {
    const it = findItem(name); if (!it) return;
    if (it.unavailable) return sys("fa-clock", `${it.name} isn't available right now.`);
    picking = { it, picks: {}, qty: 1 };
    for (const g of it.options || []) if (g.required && g.key === "size") picking.picks[g.key] = [g.choices[0].name];
    drawItem(); openSheet($("itemSheet"));
    if (fromSite) toParent({ type: "kk:open" });
  }
  function drawItem() {
    const { it, picks, qty } = picking;
    const missing = (it.options || []).filter((g) => g.required && !(picks[g.key] || []).length);
    $("ibody").innerHTML = `${phHTML(it, "ihero")}<div class="ihead"><h4>${esc(it.name)}</h4>${it.description ? `<p>${esc(it.description)}</p>` : ""}</div>
      ${(it.options || []).map((g) => `<div class="ogrp"><div class="olab">${esc(g.label)}${g.required ? '<span class="req">Required</span>' : g.multi ? '<span>Pick any</span>' : '<span>Optional</span>'}</div><div class="ochips">${g.choices.map((c) => {
        const on = (picks[g.key] || []).includes(c.name);
        const extra = c.price != null ? `${c.price}` : c.delta ? `+${c.delta}` : "";
        return `<button class="oc ${on ? "on" : ""}" data-g="${esc(g.key)}" data-c="${esc(c.name)}">${on ? '<i class="fa-solid fa-check"></i>' : ""}${esc(c.name)}${extra ? `<small>${extra}</small>` : ""}</button>`; }).join("")}</div></div>`).join("")}
      <div class="ogrp"><div class="olab">Comments<span>Optional</span></div><textarea id="inote" rows="2" maxlength="120" placeholder="Less ice, extra hot, no sugar…">${esc(picking.note || "")}</textarea></div>`;
    $("ibody").querySelectorAll(".oc").forEach((b) => b.onclick = () => {
      const g = it.options.find((x) => x.key === b.dataset.g); const cur = picks[g.key] || [];
      picks[g.key] = g.multi ? (cur.includes(b.dataset.c) ? cur.filter((x) => x !== b.dataset.c) : [...cur, b.dataset.c]) : (cur[0] === b.dataset.c && !g.required ? [] : [b.dataset.c]);
      picking.note = $("inote").value; drawItem();
    });
    $("iqty").textContent = qty;
    $("iadd").disabled = missing.length > 0;
    $("iadd").innerHTML = missing.length ? `Choose ${esc(missing[0].label.toLowerCase())}` : `<i class="fa-solid fa-basket-shopping"></i>Add · ${linePrice(it, picks) * qty} ${esc(MENU.currency)}`;
  }
  $("iminus").onclick = () => { picking.note = $("inote").value; picking.qty = Math.max(1, picking.qty - 1); drawItem(); };
  $("iplus").onclick = () => { picking.note = $("inote").value; picking.qty = Math.min(9, picking.qty + 1); drawItem(); };
  $("iadd").onclick = () => {
    const { it, picks, qty } = picking; const note = $("inote").value.trim().slice(0, 120) || null;
    addLine(it, picks, qty, note, $("iadd")); closeSheets();
    if ($("menuSheet").dataset.back) { delete $("menuSheet").dataset.back; openMenu(); }
  };

  // ---------- mood + usual: get the guest talking to the AI ----------
  const MOODS = [["fa-bed", "Sleepy", "I'm sleepy — wake me up! What do you recommend?"], ["fa-cookie-bite", "Sweet tooth", "I'm craving something sweet — what should I get?"],
    ["fa-snowflake", "Hot day", "It's hot — I want something cold and refreshing. What do you suggest?"], ["fa-utensils", "Hungry", "I'm hungry — what's good to eat here?"],
    ["fa-leaf", "Matcha mood", "I'm in a matcha mood — which one should I try?"], ["fa-wand-magic-sparkles", "Surprise me", "Surprise me! Pick something you think I'll love."]];
  function moodCard(known, again) {
    if (!again && document.querySelector(".mood")) return;
    const row = document.createElement("div"); row.className = "card mood";
    row.innerHTML = `<h4><i class="fa-solid fa-face-smile"></i>${known ? "What are you in the mood for?" : "First time here? Tell me your mood"}</h4><p>Pick one and I'll choose something for you from the menu.</p><div class="moods">${MOODS.map(([ic, l], k) => `<button data-m="${k}"><i class="fa-solid ${ic}"></i>${l}</button>`).join("")}</div>`;
    log.appendChild(row); log.scrollTop = log.scrollHeight;
    row.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => { row.querySelectorAll("button").forEach((x) => x.disabled = true); b.classList.add("on"); input.value = MOODS[+b.dataset.m][2]; sendMsg(); });
  }
  const usualText = (u) => u.map((l) => `${l.qty > 1 ? l.qty + "× " : ""}${l.name}${l.options?.length ? ` (${l.options.join(", ")})` : ""}`).join(" + ");
  function usualCard(u) {
    const row = document.createElement("div"); row.className = "card usual";
    row.innerHTML = `<h4><i class="fa-solid fa-rotate-left"></i>Your usual?</h4><p><b>${esc(usualText(u))}</b></p>
      <div class="acts"><button class="wa" data-yes><i class="fa-solid fa-check"></i>Same again</button><button class="skip" data-new>Something new</button></div>`;
    log.appendChild(row); log.scrollTop = log.scrollHeight;
    row.querySelector("[data-yes]").onclick = () => { repeatUsual(u); row.querySelector(".acts").innerHTML = '<p class="fine"><i class="fa-solid fa-basket-shopping"></i> In your cart — change anything, then Order.</p>'; };
    row.querySelector("[data-new]").onclick = () => { row.remove(); moodCard(true); };
  }
  async function repeatUsual(u) {
    await ensureMenu();
    for (const l of u) {
      const it = findItem(l.name); if (!it || it.unavailable) continue;
      const picks = {}; for (const g of it.options || []) { const hit = g.choices.filter((c) => (l.options || []).includes(c.name)).map((c) => c.name); if (hit.length) picks[g.key] = hit; }
      addLine(it, picks, l.qty, l.note);
    }
    if (cart.length) { drawCartSheet(); openSheet($("cartSheet")); }
  }

  // ---------- cart ----------
  let cart = [];
  const cartKey = () => `kk:cart:${session?.sessionId || token}`;
  const findItem = (n) => MENU?.categories.flatMap((c) => c.items).find((i) => i.name === n);
  const cartQty = (n) => cart.filter((l) => l.name === n).reduce((a, l) => a + l.qty, 0);
  const cartCount = () => cart.reduce((a, l) => a + l.qty, 0);
  const cartTotal = () => cart.reduce((a, l) => a + l.qty * (Number(l.price) || 0), 0);
  function saveCart() { LS.set(cartKey(), cart); }
  const lineKey = (name, opts, note) => `${name}|${(opts || []).join(",")}|${note || ""}`;
  function addLine(it, picks, qty, note, from) {
    const opts = (it.options || []).flatMap((g) => (picks[g.key] || []).map((c) => (g.key === "milk" && !/milk/i.test(c) ? `${c} milk` : c)));
    const size = (it.options || []).find((g) => g.key === "size") ? (picks.size || [])[0] || null : null;
    const key = lineKey(it.name, opts, note); let l = cart.find((x) => x.key === key);
    if (!l) { l = { key, name: it.name, qty: 0, price: linePrice(it, picks), opts, size, note: note || null, photo: it.photo || null }; cart.push(l); }
    l.qty += qty; saveCart(); drawCart(true);
    if (from) flyFrom(from, it.photo);
    if ($("menuSheet").classList.contains("open")) drawMenu();
    if ($("cartSheet").classList.contains("open")) drawCartSheet();
  }
  // plain items (no options) keep the quick − / + stepper; lines with options step by their key
  function changeQty(ref, d, from) {
    let l = cart.find((x) => x.key === ref) || [...cart].reverse().find((x) => x.name === ref && !x.opts?.length && !x.note);
    if (!l && d > 0) { const it = findItem(ref); if (!it) return; if (it.options?.length) return openItem(ref); return addLine(it, {}, 1, null, from); }
    if (!l) return;
    l.qty += d; if (l.qty <= 0) cart = cart.filter((x) => x !== l);
    saveCart(); drawCart(d > 0);
    if (d > 0 && from) flyFrom(from, l.photo);
    if ($("menuSheet").classList.contains("open")) drawMenu();
    if ($("cartSheet").classList.contains("open")) drawCartSheet();
  }
  function wireQty(root) {
    root.querySelectorAll("[data-inc]").forEach((b) => b.onclick = () => changeQty(b.dataset.inc, 1, b));
    root.querySelectorAll("[data-dec]").forEach((b) => b.onclick = () => changeQty(b.dataset.dec, -1));
  }
  function flyFrom(el, photo) {
    const a = el.getBoundingClientRect(); const target = document.querySelector("#mcart .ic, #cartHost .ic"); if (!target) return;
    const b = target.getBoundingClientRect(); const f = document.createElement("div"); f.className = "fly";
    if (photo) f.style.backgroundImage = `url('${photo}')`;
    f.style.left = a.left + "px"; f.style.top = a.top + "px"; document.body.appendChild(f);
    requestAnimationFrame(() => { f.style.transform = `translate(${b.left - a.left}px, ${b.top - a.top}px) scale(.4)`; f.style.opacity = ".2"; });
    setTimeout(() => f.remove(), 650);
  }
  const barHTML = (inSheet) => `<div class="cartbar"><span class="ic"><i class="fa-solid fa-basket-shopping"></i><b>${cartCount()}</b></span>
    <span class="sum">${cartTotal()} ${esc(MENU?.currency || "EGP")}<small>${cartCount()} item${cartCount() > 1 ? "s" : ""} in your cart</small></span>
    <button class="view" data-view><i class="fa-solid fa-list"></i>${inSheet ? "Cart" : "Review"}</button><button class="go" data-go><i class="fa-solid fa-paper-plane"></i>Order</button></div>`;
  // embedded on the café's own site: the page's "+" buttons fill this cart, and the page shows the count
  function toParent(msg) { try { if (parent !== window) parent.postMessage(msg, "*"); } catch {} }
  function drawCart(bump) {
    toParent({ type: "kk:cart", count: cartCount(), total: cartTotal(), currency: MENU?.currency || "EGP" });
    for (const [id, inSheet] of [["cartHost", false], ["mcart", true]]) {
      const host = $(id); host.innerHTML = cart.length ? barHTML(inSheet) : "";
      if (!cart.length) continue;
      host.querySelector("[data-view]").onclick = () => { drawCartSheet(); openSheet($("cartSheet")); };
      host.querySelector("[data-go]").onclick = sendCart;
      if (bump) host.querySelector(".ic").classList.add("bump");
    }
  }
  function drawCartSheet() {
    if (!cart.length) { closeSheets(); return; }
    $("clist").innerHTML = cart.map((l) => `<div class="cl">${phHTML(findItem(l.name) || { name: l.name, photo: l.photo })}
      <div><b>${esc(l.name)}</b><small>${[...(l.opts || []), l.note ? `“${l.note}”` : ""].filter(Boolean).map(esc).join(" · ") || "As it comes"}</small><small class="lp">${l.price} ${esc(MENU?.currency || "EGP")}</small></div>
      <span class="qty"><button data-dec="${esc(l.key || l.name)}" aria-label="One less"><i class="fa-solid fa-minus"></i></button><span>${l.qty}</span><button data-inc="${esc(l.key || l.name)}" aria-label="One more"><i class="fa-solid fa-plus"></i></button></span></div>`).join("");
    $("ctot").textContent = `${cartTotal()} ${MENU?.currency || "EGP"}`;
    wireQty($("clist"));
  }
  // the cart becomes one message — the order agent takes it from there (options, add-ons, confirm)
  function sendCart() {
    if (!cart.length || !session) return;
    // said the way a guest would: "1 Large Iced Spanish Latte with Oat milk, Extra shot (less ice)"
    const words = cart.map((l) => { const rest = (l.opts || []).filter((o) => o !== l.size);
      return `${l.qty} ${l.size ? l.size + " " : ""}${l.name}${rest.length ? ` with ${rest.join(", ")}` : ""}${l.note ? ` (${l.note})` : ""}`; });
    input.value = `I'd like ${words.length > 1 ? words.slice(0, -1).join(", ") + " and " + words.at(-1) : words[0]}`;
    cart = []; saveCart(); drawCart(); closeSheets(); sendMsg();
  }
  $("cmore").onclick = openMenu; $("cgo").onclick = sendCart;
  async function loadCart() {
    cart = (LS.get(cartKey()) || []).map((l) => ({ ...l, key: l.key || lineKey(l.name, l.opts, l.note) }));
    if (cart.length && !MENU) await ensureMenu();
    drawCart();
  }
  addEventListener("message", async (e) => {
    if (e.data?.type === "kk:prefill" && e.data.text) { input.value = e.data.text; input.focus(); }
    if (e.data?.type === "kk:add" && e.data.name && session) {
      await ensureMenu();
      const it = findItem(e.data.name);
      if (it?.options?.length) openItem(e.data.name, true);
      else if (it) changeQty(e.data.name, 1);
      else { input.value = `I'd like a ${e.data.name}`; input.focus(); }
    }
    if (e.data?.type === "kk:cart-open" && session && cart.length) { drawCartSheet(); openSheet($("cartSheet")); }
  });
  setInterval(async () => { const g = await getGeo(); if (g) geo = g; }, 45000);
  start();
})();
</script>
</body>
</html>
