<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order from your table</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  :root { --brand: #3DAE2B; --brand-soft: #e9f6e6; --ink: #14171a; --bg: #f6f7f4; --card: #fff; --muted: #6b7280; --ease: cubic-bezier(.2,.8,.2,1); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 560px; margin: 0 auto; background: var(--card); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--brand); color: #fff; }
  header img { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; background: rgba(255,255,255,.2); box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  header .t { flex: 1; min-width: 0; }
  header .name { font-weight: 800; font-size: 16px; }
  header .sub { font-size: 12.5px; opacity: .9; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.18); white-space: nowrap; transition: background .3s; }
  .pill.ok { background: rgba(255,255,255,.95); color: #1f7a16; }
  .pill.warn { background: #fff3e0; color: #a35a00; }
  #log { flex: 1; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(180deg, var(--bg), #fff 40%); scroll-behavior: smooth; }
  .row { display: flex; gap: 8px; align-items: flex-end; animation: in .32s var(--ease) both; }
  .row.me { justify-content: flex-end; }
  .av { flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 13px; }
  .msg { max-width: 84%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .ai .msg { background: #fff; border: 1px solid rgba(0,0,0,.07); border-bottom-left-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.03); }
  .me .msg { background: var(--brand); color: #fff; border-bottom-right-radius: 6px; }
  .sys { align-self: center; color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; animation: in .3s both; }
  .msg img { max-width: 100%; border-radius: 12px; display: block; margin-top: 8px; }
  .msg a { color: inherit; font-weight: 600; }
  .msg .doc { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; padding: 8px 12px; border-radius: 12px; background: var(--brand-soft); color: #1f7a16; text-decoration: none; }
  .msg .rule { display: block; height: 1px; background: rgba(0,0,0,.1); margin: 6px 0; }
  .msg .ticket { display: flex; align-items: center; gap: 8px; font-weight: 800; color: #1f7a16; }
  @keyframes in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .typing .msg { display: inline-flex; gap: 4px; padding: 14px 16px; }
  .typing .msg span { width: 7px; height: 7px; border-radius: 50%; background: #b9c0c7; animation: dot 1.2s infinite; }
  .typing .msg span:nth-child(2) { animation-delay: .15s; } .typing .msg span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 14px 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--brand); color: var(--brand); background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; animation: in .3s var(--ease) both; transition: background .2s, color .2s, transform .15s; }
  .chip:hover { background: var(--brand); color: #fff; } .chip:active { transform: scale(.96); }
  .quick { display: flex; gap: 8px; padding: 0 14px 8px; overflow-x: auto; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--bg); border: 1px solid rgba(0,0,0,.08); border-radius: 999px; padding: 7px 12px; cursor: pointer; transition: border-color .2s, transform .15s; }
  .quick button i { color: var(--brand); } .quick button:hover { border-color: var(--brand); transform: translateY(-1px); }
  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(0,0,0,.06); background: #fff; }
  input { flex: 1; font: inherit; padding: 12px 16px; border: 1.5px solid #e3e5e8; border-radius: 999px; outline: none; transition: border-color .2s, box-shadow .2s; }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  button.send { width: 46px; height: 46px; flex: 0 0 46px; color: #fff; background: var(--brand); border: 0; border-radius: 50%; cursor: pointer; font-size: 17px; transition: transform .2s var(--ease), opacity .2s; }
  button.send:hover { transform: scale(1.06) rotate(-8deg); } button.send:disabled { opacity: .45; transform: none; }
  .gate { margin: auto; padding: 30px 24px; text-align: center; color: var(--muted); animation: in .4s both; }
  .gate i { font-size: 44px; color: var(--brand); } .gate h2 { color: var(--ink); font-size: 19px; margin: 14px 0 6px; }
  [dir="rtl"] { text-align: right; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <img id="logo" alt="" hidden>
    <div class="t"><div class="name" id="rname">Connecting</div><div class="sub" id="rsub"><i class="fa-solid fa-circle-notch fa-spin"></i> Finding your table</div></div>
    <span class="pill" id="geo"><i class="fa-solid fa-location-crosshairs"></i></span>
  </header>
  <div id="log"></div>
  <div class="chips" id="chips"></div>
  <div class="quick" id="quick" hidden>
    <button data-q="Show me the menu"><i class="fa-solid fa-book-open"></i>Menu</button>
    <button data-q="What do you recommend?"><i class="fa-solid fa-star"></i>Recommend</button>
    <button data-q="Something with matcha"><i class="fa-solid fa-leaf"></i>Matcha</button>
    <button data-q="What pastries do you have?"><i class="fa-solid fa-bread-slice"></i>Pastries</button>
    <button data-q="Where is my order?"><i class="fa-solid fa-receipt"></i>My order</button>
  </div>
  <form id="f"><input id="in" placeholder="Type your order…" autocomplete="off" disabled><button class="send" id="send" disabled aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button></form>
</div>
<script>
(() => {
  const token = decodeURIComponent(location.pathname.split("/t/")[1] || "") || new URLSearchParams(location.search).get("t") || "";
  const slug = new URLSearchParams(location.search).get("r") || "koffee-kulture";
  const api = (p) => `${location.origin}${p}`;
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("in"), send = $("send"), chips = $("chips"), geoPill = $("geo"), quick = $("quick");
  let session = null, lastAt = null, geo = null, polling = null, typingRow = null;
  const seen = new Set();

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // emoji → icon where it carries meaning; every other emoji is dropped
  const ICON = { "🎫": "fa-ticket", "🧾": "fa-receipt", "📍": "fa-location-dot", "💳": "fa-credit-card", "✅": "fa-circle-check", "⭐": "fa-star", "🕐": "fa-clock", "🔥": "fa-fire", "🍟": "fa-plus" };
  const EMOJI = /(?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|‍(?:\p{Extended_Pictographic}))*/gu;
  function render(text) {
    let h = esc(text || "")
      .replace(/^[―—\-]{6,}$/gm, '<span class="rule"></span>')
      .replace(/\*([^*\n]+)\*/g, "<b>$1</b>")
      .replace(/(^|\s)_([^_\n]+)_/g, "$1<i>$2</i>")
      .replace(/(https?:\/\/[^\s<]+\.pdf)/g, '<a class="doc" href="$1" target="_blank" rel="noopener"><i class="fa-solid fa-file-pdf"></i>Receipt</a>')
      .replace(/(^|[^"])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    h = h.replace(EMOJI, (e) => { const k = Object.keys(ICON).find((x) => e.startsWith(x)); return k ? `<i class="fa-solid ${ICON[k]}" style="color:var(--brand)"></i>` : ""; });
    return h.replace(/ {2,}/g, " ").replace(/^ +| +$/gm, "");
  }
  function add(kind, text, media) {
    const row = document.createElement("div");
    row.className = `row ${kind}`;
    const body = `<div class="msg">${render(text)}${media ? `<img src="${esc(media)}" alt="">` : ""}</div>`;
    row.innerHTML = kind === "ai" ? `<div class="av"><i class="fa-solid fa-mug-hot"></i></div>${body}` : body;
    if (/[؀-ۿ]/.test(text || "")) row.querySelector(".msg").dir = "rtl";
    log.appendChild(row); log.scrollTop = log.scrollHeight;
  }
  function sys(icon, text) { const d = document.createElement("div"); d.className = "sys"; d.innerHTML = `<i class="fa-solid ${icon}"></i>${esc(text)}`; log.appendChild(d); log.scrollTop = log.scrollHeight; }
  function showTyping(on) {
    if (on && !typingRow) { typingRow = document.createElement("div"); typingRow.className = "row ai typing"; typingRow.innerHTML = '<div class="av"><i class="fa-solid fa-mug-hot"></i></div><div class="msg"><span></span><span></span><span></span></div>'; log.appendChild(typingRow); log.scrollTop = log.scrollHeight; }
    if (!on && typingRow) { typingRow.remove(); typingRow = null; }
  }
  const CHIP_ICON = (l) => /confirm|تأكيد|akked/i.test(l) ? "fa-check" : /change|عدّل|edit/i.test(l) ? "fa-pen" : /cash|كاش/i.test(l) ? "fa-money-bill-wave" : /card|كارت/i.test(l) ? "fa-credit-card" : /menu|منيو/i.test(l) ? "fa-book-open" : /yes|أيوه|aywa/i.test(l) ? "fa-thumbs-up" : /^no$|لا/i.test(l) ? "fa-xmark" : "fa-angle-right";
  function chipsFrom(text) {
    chips.innerHTML = "";
    const line = (text || "").split("\n").find((l) => l.trim().startsWith("▸"));
    if (!line) return;
    line.split("▸").map((x) => x.replace(EMOJI, "").trim()).filter(Boolean).slice(0, 4).forEach((label, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.style.animationDelay = `${i * 60}ms`;
      b.innerHTML = `<i class="fa-solid ${CHIP_ICON(label)}"></i>${esc(label)}`;
      b.onclick = () => { input.value = label; sendMsg(); };
      chips.appendChild(b);
    });
  }
  const stripChipLine = (t) => (t || "").split("\n").filter((l) => !l.trim().startsWith("▸")).join("\n").trim();

  function setGeoPill(status, dist) {
    const map = { ok: ["ok", "fa-location-dot", "At the café"], showroom: ["ok", "fa-store", "Showroom"], outside: ["warn", "fa-location-arrow", dist ? `${dist > 999 ? (dist / 1000).toFixed(1) + " km" : dist + " m"} away` : "Not here"], missing: ["warn", "fa-location-crosshairs", "Location off"] };
    const [cls, ic, label] = map[status] || ["", "fa-location-crosshairs", ""];
    geoPill.className = `pill ${cls}`; geoPill.innerHTML = `<i class="fa-solid ${ic}"></i>${label}`;
  }
  function getGeo() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition((p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }), () => resolve(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
    });
  }

  async function start() {
    if (!token) return gate("fa-qrcode", "Scan the code on your table", "It opens this chat already knowing where you sit.");
    try { const saved = JSON.parse(localStorage.getItem("kk:" + token) || "null"); if (saved && new Date(saved.expires_at) > new Date()) session = saved; } catch {}
    geo = await getGeo();
    if (!session) {
      const r = await fetch(api("/api/widget/session"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, geo }) }).catch(() => null);
      if (!r || !r.ok) { const e = r ? await r.json().catch(() => ({})) : {}; return gate("fa-triangle-exclamation", e.error === "bad table token" ? "This code isn't valid" : "Couldn't open your table", e.error === "bad table token" ? "Ask for a fresh one at the counter." : "Check your connection and try again."); }
      session = await r.json();
      try { localStorage.setItem("kk:" + token, JSON.stringify(session)); } catch {}
    }
    const R = session.restaurant || {};
    document.documentElement.style.setProperty("--brand", R.primary || "#3DAE2B");
    $("rname").textContent = R.name || "Order";
    $("rsub").innerHTML = `<i class="fa-solid fa-chair"></i> Table ${esc(session.table)}${session.branch?.name ? ` · ${esc(session.branch.name)}` : ""}`;
    if (R.logo) { $("logo").src = R.logo; $("logo").hidden = false; }
    document.title = `${R.name || "Order"} · Table ${session.table}`;
    setGeoPill(session.geofence?.status || "unknown", session.geofence?.distance_m);
    if (!session.greeted) {
      add("ai", `${(R.greeting || "Welcome!").replace(EMOJI, "").replace(/ {2,}/g, " ").trim()}\n\nYou're at *table ${session.table}*. Tell me what you'd like, or tap the menu below.`);
      session.greeted = true; try { localStorage.setItem("kk:" + token, JSON.stringify(session)); } catch {}
    }
    input.disabled = false; send.disabled = false; quick.hidden = false;
    poll(); polling = setInterval(poll, 2000);
    setInterval(async () => { const g = await getGeo(); if (g) geo = g; }, 45000);
  }
  function gate(icon, title, text) { log.innerHTML = `<div class="gate"><i class="fa-solid ${icon}"></i><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`; quick.hidden = true; input.disabled = send.disabled = true; }

  async function poll() {
    if (!session) return;
    const u = new URL(api("/api/widget/poll")); u.searchParams.set("slug", slug); u.searchParams.set("token", token); u.searchParams.set("sessionId", session.sessionId); if (lastAt) u.searchParams.set("since", lastAt);
    let r; try { r = await fetch(u); } catch { return; }
    if (r.status === 410) { clearInterval(polling); return gate("fa-hourglass-end", "Your table session ended", "Scan the code on your table again to keep ordering."); }
    if (!r.ok) return;
    const { messages } = await r.json();
    for (const m of messages || []) {
      const key = `${m.at}|${m.sender}|${(m.message || "").slice(0, 40)}`;
      if (seen.has(key)) continue; seen.add(key); lastAt = m.at;
      if (m.sender === "ai" || m.sender === "staff") { showTyping(false); add("ai", stripChipLine(m.message), m.media_type === "image" ? m.media_url : null); chipsFrom(m.message); }
    }
  }
  async function sendMsg() {
    const text = input.value.trim(); if (!text || !session) return;
    input.value = ""; chips.innerHTML = ""; add("me", text); showTyping(true);
    if (!geo) geo = await getGeo();
    const r = await fetch(api("/api/widget/send"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug, token, sessionId: session.sessionId, message: text, geo }) }).catch(() => null);
    if (r?.status === 410) { clearInterval(polling); return gate("fa-hourglass-end", "Your table session ended", "Scan the code on your table again to keep ordering."); }
    if (!r || !r.ok) { showTyping(false); return sys("fa-rotate-right", "Couldn't send that — try again."); }
    const j = await r.json().catch(() => ({}));
    if (j.geofence) setGeoPill(j.geofence);
  }
  $("f").addEventListener("submit", (e) => { e.preventDefault(); sendMsg(); });
  quick.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { input.value = b.dataset.q; sendMsg(); }));
  // the host page's menu "+" buttons prefill an order line
  addEventListener("message", (e) => { if (e.data?.type === "kk:prefill" && e.data.text) { input.value = e.data.text; input.focus(); } });
  start();
})();
</script>
</body>
</html>
